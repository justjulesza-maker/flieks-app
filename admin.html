<script>
/* Same preference the viewer app uses, read before first paint. */
(function () {
  var saved = null;
  try { saved = localStorage.getItem('flieks_mode'); } catch (e) {}
  var mode = saved || (window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-mode', mode);
})();
</script>
<style>
:root{
  --bg:#0A0A0A;--surface:#141414;--card:#1A1A1A;
  --border:#222;--border2:#2A2A2A;
  --amber:#F5A623;--red:#E8462A;--green:#4CAF50;
  --text:#F0EDE8;--muted:#888;--dim:#555;
  --fn:'DM Sans',system-ui,sans-serif;
  --fb:'Archivo Black',sans-serif;
  --toast-bg:#2A2A2A;--toast-text:#F0EDE8;
}

/* ---------- logo follows the mode ----------
   The two logos carry their own backgrounds — a dark ticket and a bone one —
   so this is a swap, not a recolour. */
.logo-dark,.logo-light{display:block}
html[data-mode="light"] .logo-dark{display:none}
html[data-mode="dark"]  .logo-light{display:none}
html:not([data-mode="light"]) .logo-light{display:none}


/* ---------- daylight ---------- */
html[data-mode="light"]{
  --toast-bg:#1C1512;--toast-text:#F5F1E8;
  --bg:#F5F1E8;--surface:#FFFFFF;--card:#FBF8F1;
  --border:#E2DACB;--border2:#D5CBB8;
  --amber:#B3660A;--accent:#B3660A;--red:#C13718;--green:#2E7D32;
  --text:#1C1512;--muted:#6B6259;--dim:#8F877D;
  color-scheme:light;
}
html[data-mode="dark"]{ color-scheme:dark; }

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;max-width:600px;margin:0 auto;padding-bottom:80px}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;height:60px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 16px;border:none;background:none;color:var(--dim);font-size:10px;letter-spacing:.5px;transition:color .2s}
.nb.on{color:var(--amber)}
.view{display:none;padding:16px 20px}
.view.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.tag-a{background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.3);color:var(--amber)}
.tag-g{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);color:var(--green)}
.tag-r{background:rgba(232,70,42,.15);border:1px solid rgba(232,70,42,.3);color:var(--red)}
.tag-m{background:var(--card);border:1px solid var(--border);color:var(--muted)}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-a{background:var(--amber);color:#0A0A0A}
.btn-g{background:var(--green);color:#0A0A0A}
.btn-r{background:var(--red);color:#fff}
.btn-sm{padding:7px 14px;width:auto;font-size:12px;border-radius:6px;display:inline-block}
.input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px;color:var(--text);font-family:var(--fb);font-size:14px;outline:none}
.input:focus{border-color:var(--amber)}
.sl{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
#sb{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:8px;font-size:12px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
#sb.show{opacity:1}
.video-preview{width:100%;border-radius:8px;border:1px solid var(--border);margin-top:8px}
</style>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCQlHW08a2J3HJRKZr83HhkGS_-wJKbegA",
  authDomain: "flieks-app.firebaseapp.com",
  databaseURL: "https://flieks-app-default-rtdb.firebaseio.com",
  projectId: "flieks-app",
  storageBucket: "flieks-app.firebasestorage.app",
  messagingSenderId: "392470139152",
  appId: "1:392470139152:web:586fa5b8cf3a43acaf9595"
};
const DB = "flieks_";
const ADMIN_EMAILS = ["jules@danceafrikalive.com","julian@discovr.tv"]; // add admin emails

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();
let currentAdmin = null;
let allFilmsCache = [];

auth.onAuthStateChanged(async user => {
  if (user && ADMIN_EMAILS.includes(user.email)) {
    currentAdmin = user;
    document.getElementById('admin-name').textContent = user.email;
    document.getElementById('view-auth').classList.remove('active');
    document.getElementById('view-queue').classList.add('active');
    document.getElementById('bnav').style.display = 'flex';
    loadQueue();
    loadUsers();
    loadPayouts();
    loadStats();
  } else if (user) {
    auth.signOut();
    snack('Access denied. Admin only.');
  } else {
    currentAdmin = null;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-auth').classList.add('active');
    document.getElementById('bnav').style.display = 'none';
  }
});

function nav(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  window.scrollTo(0,0);
  if (v === 'queue') loadQueue();
  if (v === 'films') loadAllFilms();
  if (v === 'users') loadUsers();
  if (v === 'payouts') loadPayouts();
  if (v === 'stats') loadStats();
}

/* ---- QUEUE ---- */
async function loadQueue() {
  const snap = await db.ref(DB+'admin_queue').orderByChild('status').equalTo('pending_review').once('value');
  const items = [];
  snap.forEach(c => items.push({ id: c.key, ...c.val() }));
  const el = document.getElementById('queue-list');
  if (!items.length) { el.innerHTML = `<p style="color:var(--muted);font-size:14px">No films awaiting review.</p>`; return; }
  el.innerHTML = items.map(q => `
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <div>
          <p style="font-size:14px;font-weight:700;color:var(--text)">${q.title}</p>
          <p style="font-size:12px;color:var(--muted)">${q.filmmaker} · ${new Date(q.submitted_at).toLocaleDateString('en-ZA')}</p>
        </div>
        <span class="tag tag-a">PENDING</span>
      </div>
      <button class="btn btn-a" onclick="openReview('${q.film_id||q.id}','${q.id}')">REVIEW FILM</button>
    </div>
  `).join('');
}

async function openReview(filmId, queueId) {
  const snap = await db.ref(DB+'films/'+filmId).once('value');
  const f = { id: filmId, ...snap.val() };
  document.getElementById('review-content').innerHTML = `
    <div style="margin-bottom:16px">
      <p style="font-size:24px;font-weight:700;color:var(--amber)">${f.title}</p>
      <p style="font-size:12px;color:var(--muted)">${f.filmmaker} · ${f.filmmaker_email} · ${f.duration_mins} min · ${f.language}</p>
    </div>
    ${f.video_url ? `<video src="${f.video_url}" controls class="video-preview"></video>` : `<p style="color:var(--muted);font-size:14px;margin-bottom:8px">No video URL available yet</p>`}
    <div class="card" style="margin-top:12px">
      <p class="sl">SYNOPSIS</p>
      <p style="font-size:14px;color:#999;line-height:1.6">${f.synopsis||'—'}</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0">
      <div class="stat"><p style="font-size:12px;color:var(--muted)">Genre</p><p style="font-size:14px;margin-top:2px">${(f.genre||[]).join(', ')}</p></div>
      <div class="stat"><p style="font-size:12px;color:var(--muted)">Subtitles</p><p style="font-size:14px;margin-top:2px">${f.subtitles||'None'}</p></div>
      <div class="stat"><p style="font-size:12px;color:var(--muted)">Rent</p><p style="font-size:14px;margin-top:2px;color:var(--amber)">${f.free ? 'Free' : 'R'+f.price_rent}</p></div>
      <div class="stat"><p style="font-size:12px;color:var(--muted)">Own</p><p style="font-size:14px;margin-top:2px;color:var(--amber)">${f.free ? 'Free' : 'R'+f.price_own}</p></div>
    </div>
    <div style="margin-bottom:10px">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:5px">FEATURE THIS FILM ON HOME?</label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="feat-check" style="accent-color:var(--amber);width:16px;height:16px">
        <span style="font-size:14px;color:var(--muted)">Set as featured film</span>
      </label>
    </div>
    <div style="margin-bottom:14px">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:5px">REJECTION REASON (if rejecting)</label>
      <textarea class="input" id="rej-reason" placeholder="Optional — explain why the film was not approved…" style="resize:vertical;min-height:60px;font-size:14px"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-g" onclick="approveFilm('${filmId}','${queueId}')">✓ APPROVE</button>
      <button class="btn btn-r" onclick="rejectFilm('${filmId}','${queueId}')">✗ REJECT</button>
    </div>
  `;
  nav('review');
}

async function approveFilm(filmId, queueId) {
  const featured = document.getElementById('feat-check').checked;
  if (featured) {
    // Un-feature existing
    const existing = await db.ref(DB+'films').orderByChild('featured').equalTo(true).once('value');
    existing.forEach(c => db.ref(DB+'films/'+c.key+'/featured').set(false));
  }
  await db.ref(DB+'films/'+filmId).update({ status: 'live', featured, published_at: Date.now() });
  if (queueId) await db.ref(DB+'admin_queue/'+queueId).update({ status: 'approved' });
  snack('Film approved and live!');
  nav('queue');
}

async function rejectFilm(filmId, queueId) {
  const reason = document.getElementById('rej-reason').value.trim();
  await db.ref(DB+'films/'+filmId).update({ status: 'rejected', rejection_reason: reason || 'Does not meet content guidelines.' });
  if (queueId) await db.ref(DB+'admin_queue/'+queueId).update({ status: 'rejected' });
  snack('Film rejected.');
  nav('queue');
}

/* ---- ALL FILMS ---- */
async function loadAllFilms() {
  // Read over REST with a freshly minted token rather than through the SDK.
  // The SDK caches aggressively and has been observed returning a stale,
  // partial list here — one film where the database holds four.
  const v = await readNode('films');
  allFilmsCache = Object.entries(v).map(([id, f]) => ({ id, ...f }));

  allFilmsCache.sort((a,b) => (b.published_at||b.submitted_at||0) - (a.published_at||a.submitted_at||0));
  console.log(`[admin] ${allFilmsCache.length} films loaded`);
  renderFilmsList(allFilmsCache);
  loadStreamingStates();
}

/* Which films have been prepared for adaptive streaming. */
async function loadStreamingStates() {
  for (const f of allFilmsCache) {
    const el = document.getElementById('stream-' + f.id);
    if (!el) continue;
    try {
      const r = await fetch('/.netlify/functions/flieks-bunny', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: await auth.currentUser.getIdToken(), filmId: f.id, action: 'status' })
      });
      const d = await r.json();
      paintStreamState(f.id, d);
    } catch { el.textContent = ''; }
  }
}

function paintStreamState(id, d) {
  const el = document.getElementById('stream-' + id);
  const btn = document.getElementById('prep-' + id);
  if (!el) return;
  const link = document.getElementById('link-' + id);
  if (d.state === 'ready') {
    el.innerHTML = '<span style="color:var(--green,#4ADE80)">● streaming</span>';
    if (btn) btn.style.display = 'none';
    if (link) link.style.display = 'none';
  } else if (d.state === 'not started') {
    el.innerHTML = '<span style="color:var(--muted)">○ not prepared</span>';
    if (btn) btn.style.display = 'inline-block';
  } else if (d.state === 'failed' || d.state === 'stalled') {
    el.innerHTML = `<span style="color:var(--red,#E8462A)">● ${
      d.state === 'stalled' ? 'no file received' : 'failed'}</span>`;
    if (btn) { btn.style.display = 'inline-block'; btn.textContent = 'Reset & retry';
               btn.onclick = () => resetStream(id); }
  } else {
    el.innerHTML = `<span style="color:var(--amber,#F5A623)">● preparing${
      d.progress != null ? ' ' + d.progress + '%' : ''}</span>`;
    if (btn) btn.style.display = 'none';
    setTimeout(() => refreshOne(id), 8000);
  }
}

async function refreshOne(id) {
  try {
    const r = await fetch('/.netlify/functions/flieks-bunny', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: await auth.currentUser.getIdToken(), filmId: id, action: 'status' })
    });
    paintStreamState(id, await r.json());
  } catch {}
}

/* Bunny's own ingest has proved unreliable — their fetch endpoint accepts a job
   and never retrieves the file, and a direct push is acknowledged but discarded.
   Uploading through the Bunny dashboard works, so this simply lets us point a
   film at a video that is already there. */
async function linkBunny(filmId, title) {
  const box = document.getElementById('stream-' + filmId);
  if (box) box.innerHTML = '<span style="color:var(--muted)">loading library…</span>';

  let items = [];
  try {
    const r = await fetch('/.netlify/functions/flieks-bunny', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: await auth.currentUser.getIdToken(), filmId, action: 'library' })
    });
    items = (await r.json()).items || [];
  } catch { snack('Could not read the Bunny library.'); refreshOne(filmId); return; }

  const usable = items.filter(v => v.mb > 0);
  if (!usable.length) {
    snack('No uploaded videos in the Bunny library yet.');
    refreshOne(filmId);
    return;
  }

  // Offer the closest title first — dashboard uploads usually keep the filename.
  const t = (title || '').toLowerCase();
  usable.sort((a, b) => {
    const am = (a.title || '').toLowerCase().includes(t.slice(0, 6)) ? 0 : 1;
    const bm = (b.title || '').toLowerCase().includes(t.slice(0, 6)) ? 0 : 1;
    return am - bm;
  });

  const list = usable.map((v, i) =>
    `${i + 1}. ${v.title} — ${v.mb}MB, ${v.state}`).join('\n');
  const pick = prompt(
    `Which Bunny video is "${title}"?\n\n${list}\n\nEnter a number:`, '1');
  if (!pick) { refreshOne(filmId); return; }

  const chosen = usable[parseInt(pick, 10) - 1];
  if (!chosen) { snack('That was not one of the options.'); refreshOne(filmId); return; }

  try {
    const r = await fetch('/.netlify/functions/flieks-bunny', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: await auth.currentUser.getIdToken(),
        filmId, action: 'link', bunnyId: chosen.id
      })
    });
    const d = await r.json();
    if (!r.ok) { snack(d.message || 'Could not link that.'); refreshOne(filmId); return; }
    snack(`Linked to ${chosen.title} (${d.mb}MB)`);
    refreshOne(filmId);
  } catch { snack('Could not link that.'); refreshOne(filmId); }
}

async function resetStream(id) {
  const btn = document.getElementById('prep-' + id);
  if (btn) { btn.disabled = true; btn.textContent = 'Clearing…'; }
  try {
    await fetch('/.netlify/functions/flieks-bunny', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: await auth.currentUser.getIdToken(), filmId: id, action: 'reset' })
    });
    if (btn) { btn.disabled = false; btn.textContent = 'Prepare'; btn.onclick = () => prepareStream(id); }
    refreshOne(id);
  } catch { snack('Could not clear that.'); }
}

async function prepareStream(id) {
  const btn = document.getElementById('prep-' + id);
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  try {
    const r = await fetch('/.netlify/functions/flieks-bunny', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: await auth.currentUser.getIdToken(), filmId: id, action: 'ingest' })
    });
    const d = await r.json();
    if (!r.ok) {
      console.error('[bunny]', d);
      snack(d.message || 'Could not start.');
      if (d.bunnySaid) console.error('[bunny] said:', d.bunnySaid);
      if (btn) { btn.disabled = false; btn.textContent = 'Prepare'; }
      return;
    }
    snack('Sent to Bunny. Transcoding takes a few minutes.');
    setTimeout(() => refreshOne(id), 5000);
  } catch {
    snack('Could not reach the server.');
    if (btn) { btn.disabled = false; btn.textContent = 'Prepare'; }
  }
}

function renderFilmsList(films) {
  const el = document.getElementById('all-films-list');
  if (!films.length) { el.innerHTML = `<p style="color:var(--muted);font-size:14px">No films.</p>`; return; }
  const statusTag = { live:'tag-g', review:'tag-a', draft:'tag-m', rejected:'tag-r' };
  el.innerHTML = films.map(f => `
    <div class="card row">
      <div style="flex:1">
        <div class="row" style="margin-bottom:4px">
          <p style="font-size:14px;font-weight:700">${f.title}</p>
          <span class="tag ${statusTag[f.status]||'tag-m'}">${(f.status||'').toUpperCase()}</span>
        </div>
        <p style="font-size:12px;color:var(--muted)">${f.filmmaker} · ${f.view_count||0} views · R${((f.own_count||0)*(f.price_own||0)*0.7 + (f.rent_count||0)*(f.price_rent||0)*0.7).toFixed(0)} earned</p>
        <p style="font-size:11px;margin-top:3px" id="stream-${f.id}">checking…</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-left:10px">
        <button class="btn btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--muted)" onclick="toggleFilmStatus('${f.id}','${f.status}')">
          ${f.status === 'live' ? 'Take Down' : 'Go Live'}
        </button>
        <button class="btn btn-sm" id="prep-${f.id}" style="display:none;background:var(--card);border:1px solid var(--border);color:var(--muted)" onclick="prepareStream('${f.id}')">
          Prepare
        </button>
        <button class="btn btn-sm" id="link-${f.id}" style="background:var(--card);border:1px solid var(--border);color:var(--muted)" onclick="linkBunny('${f.id}','${(f.title||'').replace(/'/g,'')}')">
          Link
        </button>
        <button class="btn btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--accent,#F0A62E)"
          onclick="filmUpdate('${f.id}')">Update</button>
      </div>
    </div>
  `).join('');
}

function searchFilms(q) {
  const term = q.toLowerCase();
  renderFilmsList(allFilmsCache.filter(f => f.title.toLowerCase().includes(term) || f.filmmaker.toLowerCase().includes(term)));
}

async function toggleFilmStatus(id, status) {
  const newStatus = status === 'live' ? 'draft' : 'live';
  await db.ref(DB+'films/'+id).update({ status: newStatus, ...(newStatus === 'live' ? { published_at: Date.now() } : {}) });
  snack(`Film ${newStatus === 'live' ? 'published' : 'taken down'}.`);
  loadAllFilms();
}

/* ---- USERS ---- */
async function loadUsers() {
  const appEl = document.getElementById('applications-list');
  const uEl = document.getElementById('users-list');
  try {
    // Applications
    const appSnap = await db.ref(DB+'filmmaker_applications').once('value');
    const apps = [];
    appSnap.forEach(c => { const v = c.val(); if (v.status === 'pending') apps.push({ id: c.key, ...v }); });
    appEl.innerHTML = apps.length === 0 ? `<p style="color:var(--muted);font-size:14px">No pending applications.</p>` :
      apps.map(a => `
        <div class="card">
          <div class="row" style="margin-bottom:6px">
            <div><p style="font-size:14px;font-weight:600">${a.name||'—'}</p><p style="font-size:12px;color:var(--muted)">${a.email||''} · ${a.location||'—'}</p></div>
            <span class="tag tag-a">PENDING</span>
          </div>
          ${a.bio ? `<p style="font-size:12px;color:var(--muted);margin-bottom:10px">${a.bio}</p>` : ''}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <button class="btn btn-g" onclick="approveFilmmaker('${a.uid}','${a.id}')">APPROVE</button>
            <button class="btn btn-r" onclick="rejectFilmmaker('${a.uid}','${a.id}')">REJECT</button>
          </div>
        </div>
      `).join('');
  } catch(e) {
    appEl.innerHTML = `<p style="color:var(--muted);font-size:14px">Error loading applications: ${e.message}</p>`;
  }
  try {
    // All users — use REST API to bypass SDK caching
    const token = await currentAdmin.getIdToken(true); // force refresh
    const resp = await fetch(`https://flieks-app-default-rtdb.firebaseio.com/flieks_users.json?auth=${token}`);
    const data = await resp.json();
    const users = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
    if (users.length === 0) {
      uEl.innerHTML = `<p style="color:var(--muted);font-size:14px">No users yet.</p>`;
    } else {
      uEl.innerHTML = users.map(u => `
        <div class="card row">
          <div>
            <p style="font-size:14px;font-weight:600">${u.name||'—'}</p>
            <p style="font-size:12px;color:var(--muted)">${u.email||''} · <span style="color:${u.role==='filmmaker'?'var(--amber)':u.role==='admin'?'var(--green)':'var(--muted)'}">${u.role||'viewer'}</span></p>
          </div>
        </div>
      `).join('');
    }
  } catch(e) {
    uEl.innerHTML = `<p style="color:var(--red);font-size:14px">Error loading users: ${e.message}</p>`;
  }
}

async function approveFilmmaker(uid, appId) {
  await db.ref(DB+'users/'+uid).update({ role: 'filmmaker' });
  await db.ref(DB+'filmmaker_applications/'+appId).update({ status: 'approved' });
  snack('Filmmaker approved!');
  loadUsers();
}

async function rejectFilmmaker(uid, appId) {
  await db.ref(DB+'filmmaker_applications/'+appId).update({ status: 'rejected' });
  snack('Application rejected.');
  loadUsers();
}

/* ---- PAYOUTS ---- */
async function loadPayouts() {
  const el = document.getElementById('payouts-list');
  el.innerHTML = '<div class="spinner"></div>';

  let payouts = [];
  try {
    const r = await fetch('/.netlify/functions/flieks-payout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: await auth.currentUser.getIdToken(), action: 'list' })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    payouts = d.payouts || [];
  } catch (e) {
    el.innerHTML = `<p style="color:var(--red);font-size:14px">Could not load payouts. ${e.message || ''}</p>`;
    return;
  }

  if (!payouts.length) {
    el.innerHTML = `<p style="color:var(--muted);font-size:14px">Nothing waiting to be paid.</p>`;
    return;
  }

  const total = payouts.reduce((s, p) => s + p.amount, 0);

  el.innerHTML = `
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px">
      ${payouts.length} request${payouts.length === 1 ? '' : 's'} ·
      <b style="color:var(--text)">R${total.toFixed(2)}</b> to pay</p>
    ${payouts.map(p => `
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <div>
          <p style="font-size:18px;font-weight:700;color:var(--green)">R${p.amount.toFixed(2)}</p>
          <p style="font-size:13px;color:var(--text)">${p.name || 'Unnamed'}</p>
          <p style="font-size:12px;color:var(--muted)">${p.email || ''}</p>
          <p style="font-size:11px;color:var(--dim)">
            ${p.sales} sale${p.sales === 1 ? '' : 's'} ·
            requested ${new Date(p.requested_at).toLocaleDateString('en-ZA')}</p>
        </div>
        <span class="tag tag-a">PENDING</span>
      </div>

      ${p.bank ? `
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;
                    padding:11px 12px;margin-bottom:10px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.7">
          <div>${p.bank.holder}</div>
          <div>${p.bank.bank} · ${p.bank.account_type || ''}</div>
          <div>Acc ${p.bank.account_number}</div>
          <div>Branch ${p.bank.branch_code}</div>
        </div>
        <button class="btn btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--muted);margin-bottom:8px"
          onclick='copyBank(${JSON.stringify(JSON.stringify(p.bank))})'>COPY DETAILS</button>`
      : `<p style="font-size:12px;color:var(--red);margin-bottom:10px">No bank details on file.</p>`}

      <button class="btn btn-g" onclick="settlePayout('${p.uid}','${p.id}','${(p.name||'').replace(/'/g,'')}',${p.amount})">
        MARK AS PAID
      </button>
    </div>`).join('')}`;
}

/* ============================================================
   FILMMAKER UPDATES
   Filmmakers forget the film is out there. A link on its own gets ignored;
   a note with real numbers in it does not.
   ============================================================ */
async function filmUpdate(filmId) {
  const wrap = document.createElement('div');
  wrap.id = 'upd-modal';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.8);' +
    'display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto';
  wrap.innerHTML = `<div style="background:var(--surface);border-radius:14px;padding:22px 20px;
    max-width:560px;width:100%;max-height:90dvh;overflow:auto" id="upd-body">
    <p style="color:var(--muted);font-size:14px">Pulling the numbers…</p></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });

  let d;
  try {
    const r = await fetch('/.netlify/functions/flieks-results', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: await auth.currentUser.getIdToken(), filmId })
    });
    d = await r.json();
    if (!r.ok) throw new Error(d.message);
  } catch (e) {
    document.getElementById('upd-body').innerHTML =
      `<p style="color:var(--red);font-size:14px">${e.message || 'Could not load that.'}</p>`;
    return;
  }

  const film = allFilmsCache.find(f => f.id === filmId) || {};
  const h = d.headline;
  const top = d.people[0];
  const reportUrl = film.results_key ? `${location.origin}/report/${film.results_key}` : '';

  const message = writeUpdate(d, film, reportUrl);

  document.getElementById('upd-body').innerHTML = `
    <p class="section-label" style="margin-bottom:3px">UPDATE FOR ${(film.filmmaker || 'THE FILMMAKER').toUpperCase()}</p>
    <p style="font-family:var(--fb);font-size:20px;color:var(--text);margin-bottom:14px">${d.film.title}</p>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
                border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:14px">
      ${[['Paid', h.buyers], ['Opens', h.clicks], ['Rate', h.conversion + '%'],
         ['Owed', 'R' + Number(d.filmmakerShare || 0).toFixed(0)]].map(([k, v]) => `
        <div style="background:var(--card);padding:11px 8px;text-align:center">
          <p style="font-size:16px;font-weight:700;color:var(--text)">${v}</p>
          <p style="font-size:9.5px;color:var(--muted);margin-top:2px;letter-spacing:.08em">${k.toUpperCase()}</p>
        </div>`).join('')}
    </div>

    <textarea id="upd-text" rows="13"
      style="width:100%;font:inherit;font-size:13.5px;line-height:1.55;padding:13px;border-radius:9px;
             background:var(--card);border:1px solid var(--border);color:var(--text);
             resize:vertical;margin-bottom:10px">${message}</textarea>

    <button class="btn btn-g" onclick="copyUpdate()">COPY MESSAGE</button>
    <button class="btn btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--muted);margin-top:8px;width:100%"
      onclick="mailUpdate('${(film.filmmaker_email || '').replace(/'/g,'')}','${(d.film.title || '').replace(/'/g,'')}')">
      OPEN IN EMAIL</button>
    ${!reportUrl ? `<button class="btn btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--accent,#F0A62E);margin-top:8px;width:100%"
      onclick="makeReport('${filmId}')">CREATE A SHAREABLE REPORT FIRST</button>` : ''}
    <button class="btn btn-sm" style="background:none;border:0;color:var(--muted);margin-top:10px;width:100%"
      onclick="document.getElementById('upd-modal').remove()">CLOSE</button>`;
}

/* The numbers are the message. Everything else is just enough scaffolding to
   make them readable, plus one thing the filmmaker could actually act on. */
function writeUpdate(d, film, reportUrl) {
  const h = d.headline;
  const name = (film.filmmaker || '').split(' ')[0] || 'there';
  const top = d.people[0];
  const owed = Number(d.filmmakerShare || 0);
  const L = [];

  L.push(`Hi ${name}`);
  L.push('');

  if (!h.buyers) {
    L.push(`Quick update on ${d.film.title}. It's live and ${h.clicks} ${h.clicks === 1 ? 'person has' : 'people have'} opened a link to it, but nobody has bought yet.`);
    L.push('');
    L.push(top
      ? `Most of that traffic came through ${top.name}. Getting the rest of the cast posting is usually what turns opens into sales — each of them has their own link in the portal.`
      : `The thing that moves the needle is cast links. Everyone in the film has their own in the portal, and we can see exactly who brings people in.`);
  } else {
    L.push(`Quick update on ${d.film.title}.`);
    L.push('');
    L.push(`${h.buyers} ${h.buyers === 1 ? 'person has' : 'people have'} paid to watch it${
      h.clicks ? `, out of ${h.clicks} who opened a link — that's ${h.conversion}% converting` : ''}.`);
    if (h.owned || h.rentals) {
      L.push(`${h.owned} bought it outright${h.rentals ? `, ${h.rentals} rented` : ''}${
        h.gifted ? `, ${h.gifted} bought it as a gift` : ''}.`);
    }
    if (h.ratingCount) {
      L.push(`Rated ${Number(h.rating).toFixed(1)} out of 5 by ${h.ratingCount} ${h.ratingCount === 1 ? 'viewer' : 'viewers'}.`);
    }
    L.push('');
    if (top && top.sales) {
      L.push(`${top.name} has brought in the most — ${top.sales} ${top.sales === 1 ? 'sale' : 'sales'} from ${top.clicks} opens. Worth thanking them.`);
    } else if (top) {
      L.push(`${top.name} has driven the most traffic so far with ${top.clicks} opens.`);
    }
  }

  if (owed >= 1) {
    L.push('');
    L.push(`You have R${owed.toFixed(2)} earned so far. You can request a payout from the portal once you're over the minimum — bank details go in there too.`);
  }

  if (reportUrl) {
    L.push('');
    L.push(`Full report, which you're welcome to share with funders or festivals:`);
    L.push(reportUrl);
  }

  L.push('');
  L.push(`Anything you need, just shout.`);
  L.push('');
  L.push(`Julian`);
  return L.join('\n');
}

async function copyUpdate() {
  await navigator.clipboard.writeText(document.getElementById('upd-text').value);
  snack('Message copied.');
}

function mailUpdate(email, title) {
  const body = encodeURIComponent(document.getElementById('upd-text').value);
  const subject = encodeURIComponent(`${title} on 4flieks — how it's doing`);
  window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
}

async function makeReport(filmId) {
  const key = [...crypto.getRandomValues(new Uint8Array(16))]
    .map(b => b.toString(36).padStart(2, '0')).join('').slice(0, 24);
  try {
    await db.ref(DB + 'result_keys/' + key).set(filmId);
    await db.ref(DB + 'films/' + filmId).update({
      results_public: true, results_key: key, results_show_revenue: true
    });
    const f = allFilmsCache.find(x => x.id === filmId);
    if (f) Object.assign(f, { results_public: true, results_key: key });
    snack('Report created.');
    document.getElementById('upd-modal').remove();
    filmUpdate(filmId);
  } catch { snack('Could not create that.'); }
}

async function copyBank(json) {
  const b = JSON.parse(json);
  const text = `${b.holder}\n${b.bank}\nAccount: ${b.account_number}\nBranch: ${b.branch_code}\n${b.account_type || ''}`;
  await navigator.clipboard.writeText(text);
  snack('Bank details copied.');
}

async function settlePayout(uid, payoutId, name, amount) {
  const ref = prompt(
    `Confirm you have paid R${amount.toFixed(2)} to ${name}.\n\n` +
    `This marks those sales as settled so they cannot be paid again.\n\n` +
    `Your EFT reference (optional):`);
  if (ref === null) return;

  try {
    const r = await fetch('/.netlify/functions/flieks-payout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: await auth.currentUser.getIdToken(),
        action: 'settle', uid, payoutId, reference: ref
      })
    });
    const d = await r.json();
    if (!r.ok) { snack(d.message || 'Could not do that.'); return; }
    snack('Marked as paid.');
    loadPayouts();
  } catch { snack('Could not reach the server.'); }
}


/* Read a whole node over REST. The SDK caches and has been seen returning
   stale, partial data — which on this page would mean wrong revenue figures. */
async function readNode(path) {
  try {
    const token = await auth.currentUser.getIdToken(true);
    const res = await fetch(
      `https://flieks-app-default-rtdb.firebaseio.com/${DB}${path}.json?auth=${token}`);
    return res.ok ? ((await res.json()) || {}) : {};
  } catch (e) {
    console.error(`[admin] could not read ${path}:`, e);
    return {};
  }
}

/* ---- STATS ---- */
async function loadStats() {
  const [films, users, txs] = await Promise.all([
    readNode('films'), readNode('users'), readNode('transactions')
  ]);
  const filmsSnap = { forEach: fn => Object.values(films).forEach(v => fn({ val: () => v })) };
  const usersSnap = { forEach: fn => Object.values(users).forEach(v => fn({ val: () => v })) };
  const txSnap    = { forEach: fn => Object.values(txs).forEach(v => fn({ val: () => v })) };

  let totalFilms=0, liveFilms=0, totalViews=0, totalRevenue=0, totalUsers=0;
  filmsSnap.forEach(c => {
    const f = c.val();
    totalFilms++;
    if (f.status==='live') liveFilms++;
    totalViews += f.view_count||0;
  });
  usersSnap.forEach(() => totalUsers++);
  txSnap.forEach(c => {
    const t = c.val();
    if (t.status==='complete') totalRevenue += t.amount||0;
  });
  document.getElementById('platform-stats').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
      <div class="stat"><p style="font-size:10px;color:var(--muted)">Total Films</p><p style="font-size:24px;font-weight:700;margin-top:2px">${totalFilms}</p></div>
      <div class="stat"><p style="font-size:10px;color:var(--muted)">Live</p><p style="font-size:24px;font-weight:700;margin-top:2px;color:var(--green)">${liveFilms}</p></div>
      <div class="stat"><p style="font-size:10px;color:var(--muted)">Total Views</p><p style="font-size:24px;font-weight:700;margin-top:2px">${totalViews >= 1000 ? (totalViews/1000).toFixed(1)+'k' : totalViews}</p></div>
      <div class="stat"><p style="font-size:10px;color:var(--muted)">Users</p><p style="font-size:24px;font-weight:700;margin-top:2px">${totalUsers}</p></div>
    </div>
    <div class="stat" style="text-align:center;padding:20px;margin-bottom:16px">
      <p style="font-size:12px;color:var(--muted);margin-bottom:6px">TOTAL PLATFORM REVENUE</p>
      <p style="font-size:32px;font-weight:700;color:var(--amber)">R${totalRevenue.toFixed(2)}</p>
      <p style="font-size:12px;color:var(--muted);margin-top:4px">30% = R${(totalRevenue*0.3).toFixed(2)} platform · 70% = R${(totalRevenue*0.7).toFixed(2)} filmmakers</p>
    </div>
    <button class="btn" style="background:var(--card);border:1px solid var(--border);color:var(--muted)" onclick="auth.signOut()">SIGN OUT</button>
  `;
}

/* ---- AUTH ---- */
async function adminSignIn() {
  const email = document.getElementById('a-email').value.trim();
  const pass = document.getElementById('a-pass').value;
  if (!email || !pass) return snack('Enter credentials');
  try { await auth.signInWithEmailAndPassword(email, pass); }
  catch(e) { snack('Sign in failed'); }
}

let st;
function snack(msg) {
  const el = document.getElementById('sb');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(st);
  st = setTimeout(() => el.classList.remove('show'), 3000);
}
