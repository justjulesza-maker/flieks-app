<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4flieks Lab — AI tools for African filmmakers</title>
<meta name="description" content="Free AI tools for writers, filmmakers and actors: Script Report, a one-page pitch, cast match and Script Coach. From 4flieks, the home of African film.">
<meta name="robots" content="noindex" id="robots">
<link rel="icon" href="/brand/svg/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F0E6; --card:#FBF8F1; --ink:#17110E; --ink-2:#5E564D; --ink-3:#8A8177;
  --rule:#D9D1C2; --sunset:#C2501F; --ochre:#A87515; --green:#2E7D32;
  --fb:'Archivo Black',sans-serif; --fn:'DM Sans',system-ui,sans-serif; --fm:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8E2D4;color:var(--ink);font-family:var(--fn);padding:28px 14px 70px;-webkit-font-smoothing:antialiased}
.sheet{position:relative;max-width:860px;margin:0 auto;background:var(--paper);padding:46px 52px 40px;
  box-shadow:0 1px 3px rgba(23,17,14,.08),0 12px 40px rgba(23,17,14,.09)}
.sheet::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;
  background:repeating-linear-gradient(90deg,var(--sunset) 0 15px,transparent 15px 24px)}
@media (max-width:640px){.sheet{padding:34px 20px 30px}}
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:28px}
.mark{font-family:var(--fb);font-size:15px;color:var(--ink);text-decoration:none}
.mark em{color:var(--sunset);font-style:normal}
.docref{font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);text-align:right;line-height:1.7}
h1{font-family:var(--fb);font-size:36px;line-height:1.1;letter-spacing:-.015em;margin-bottom:8px}
h2{font-family:var(--fm);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sunset);margin:34px 0 12px}
h3{font-size:15px;font-weight:700;margin-bottom:4px}
p{font-size:15px;line-height:1.6}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3);line-height:1.55}
.meta{font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;color:var(--ink-2);margin-bottom:22px}
.logline{font-family:var(--fb);font-size:21px;line-height:1.35;border-left:4px solid var(--sunset);padding:4px 0 4px 16px;margin:6px 0 4px}
.verdict{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);padding:16px 18px;margin:22px 0 4px}
.chip{flex:none;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:4px;color:#fff}
@media (max-width:560px){.verdict{flex-direction:column;gap:10px}}
.chip.strong{background:var(--green)} .chip.promising{background:var(--ochre)} .chip.needs{background:var(--sunset)}
.srow{display:grid;grid-template-columns:130px 1fr 34px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.srow .k{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.track{height:8px;background:#E4DCCB;border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--sunset)}
.srow .v{font-family:var(--fm);font-weight:700;text-align:right}
.srow .why{grid-column:1/-1;font-size:13px;color:var(--ink-2);margin-top:-2px}
@media (max-width:560px){.srow{grid-template-columns:100px 1fr 30px}}
.stack{display:flex;height:34px;border-radius:4px;overflow:hidden;margin-bottom:8px}
.stack div{display:flex;align-items:center;padding:0 10px;font-family:var(--fm);font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;background:var(--card);border:1px solid var(--rule);padding:4px 10px;border-radius:999px}
.chart{background:var(--card);border:1px solid var(--rule);padding:14px 14px 8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:-1px}
.moments{list-style:none;margin-top:10px;columns:2;column-gap:26px}
.moments li{font-size:12.5px;line-height:1.45;padding:4px 0;break-inside:avoid;color:var(--ink-2)}
.moments b{font-family:var(--fm);font-size:11px;color:var(--ink)}
@media (max-width:560px){.moments{columns:1}}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.box{background:var(--card);border:1px solid var(--rule);padding:14px 16px}
.box .lbl{font-family:var(--fm);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.beats{margin-top:12px}
.beats div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.5}
.beats div b{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:400;padding-top:2px}
@media (max-width:560px){.beats div{grid-template-columns:1fr;gap:2px}}
.char{padding:14px 0;border-top:1px solid var(--rule)}
.char .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.char .role{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.share{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;color:var(--ink-2)}
.share .track{width:90px}
.char p{font-size:14px;margin-top:4px}
.char .cast{font-size:13px;color:var(--ink-2);margin-top:4px}
ul.plain{list-style:none}
ul.plain li{font-size:14.5px;line-height:1.55;padding:8px 0 8px 18px;border-top:1px solid var(--rule);position:relative}
ul.plain li::before{content:'—';position:absolute;left:0;color:var(--sunset)}
.note{padding:10px 0;border-top:1px solid var(--rule)}
.note .area{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sunset)}
.note .where{font-family:var(--fm);font-size:10.5px;color:var(--ink-3);margin-left:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.facts div{background:var(--card);padding:12px 14px}
.facts .n{font-family:var(--fb);font-size:22px}
.facts .k{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.price{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.price div{background:var(--ink);color:var(--paper);padding:10px 16px}
.price b{font-family:var(--fb);font-size:22px;display:block}
.price span{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.fests{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.fest{background:var(--card);border:1px solid var(--rule);padding:12px 14px;break-inside:avoid}
.fest .ftop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fest .ftop b{font-size:14.5px;line-height:1.3}
.ftag{flex:none;font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--ink);border-radius:3px;white-space:nowrap}
.ftag.dev{background:var(--ink);color:var(--paper)}
.fregions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.freg{display:flex;align-items:center;gap:7px;margin:0!important;font:500 13px var(--fn)!important;letter-spacing:0!important;text-transform:none!important;color:var(--paper)!important;border:1px solid #6B5A4E;border-radius:999px;padding:7px 12px;cursor:pointer}
.freg input{accent-color:var(--sunset)}
.fund{border-top:1px solid #4A3D34;padding:12px 0}
.fund .ftop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fund .ftop b{color:var(--paper);font-size:14.5px;line-height:1.35}
.fund p{color:#D9D1C2;font-size:13.5px;margin-top:4px}
.fst{flex:none;font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid #6B5A4E;color:#D9D1C2;white-space:nowrap}
.fst.open{background:#2E7D32;border-color:#2E7D32;color:#fff}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px!important}
.fmeta b{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#B9AB9B;font-weight:400;margin-right:4px}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
@media (max-width:640px){.targets{grid-template-columns:1fr}}
.tgt{border-top:1px solid var(--rule);padding:7px 0;display:flex;flex-direction:column;gap:2px}
.tgt b{font-size:14px}
.tgt span{font-size:12.5px;color:var(--ink-2)}
.tgt a{font-size:12.5px;color:var(--sunset)}
.finc{display:inline-flex!important;align-items:center;gap:7px;margin:8px 0 0!important;font:600 13px var(--fn)!important;letter-spacing:0!important;text-transform:none!important;color:var(--paper)!important;cursor:pointer}
.finc input{accent-color:var(--sunset);width:16px;height:16px}
.foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--rule)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button,.btn{font:700 13px var(--fn);padding:10px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--ink)}
button.danger{background:transparent;color:var(--sunset);border-color:var(--sunset)}
button:disabled{opacity:.5;cursor:default}
/* workspace */
label{display:block;font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 6px}
input[type=text]{width:100%;font:15px var(--fn);padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink)}
.drop{border:1.5px dashed var(--rule);border-radius:8px;background:var(--card);padding:22px;text-align:center;cursor:pointer}
.drop.has{border-style:solid;border-color:var(--ink)}
.prog{height:6px;background:#E4DCCB;border-radius:3px;overflow:hidden;margin-top:12px;display:none}
.prog div{height:100%;width:0;background:var(--sunset);transition:width .2s}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--sunset)}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.item a{color:var(--ink);font-weight:700;text-decoration:none}
.item .st{font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.spin{width:28px;height:28px;border:3px solid var(--rule);border-top-color:var(--sunset);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
.center{text-align:center;padding:40px 0}
/* owner panel + pitch */
.panel{background:var(--ink);color:var(--paper);padding:20px 22px;margin:-6px 0 26px;border-radius:6px}
.panel h3{color:var(--paper);font-size:16px;margin-bottom:4px}
.panel p{color:#D9D1C2;font-size:13.5px}
.panel label{color:#B9AF9F}
.panel input[type=text],.panel textarea,.panel select{width:100%;font:14px var(--fn);padding:10px 11px;border:1px solid #4A3D34;border-radius:6px;background:#241C18;color:var(--paper)}
.panel textarea{min-height:84px;resize:vertical}
.panel .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.panel .row2{grid-template-columns:1fr}}
.panel button{background:var(--sunset);border-color:var(--sunset);color:#fff}
.panel .ghost{background:transparent;color:var(--paper);border-color:#6B5A4E}
.panel a{color:#F2C7A8}
.headline{font-family:var(--fn);font-style:italic;font-size:19px;color:var(--ink-2);margin:2px 0 16px}
.kf{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:18px 0 6px}
.kf div{flex:1 1 120px;background:var(--card);padding:10px 12px}
.kf b{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-bottom:3px}
.kf span{font-size:14px;font-weight:700}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 34px}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.pgrid h2{margin-top:22px}
.ask{background:var(--ink);color:var(--paper);padding:18px 20px;margin-top:26px}
.ask h2{color:#F2C7A8;margin:0 0 8px}
.ask p{color:var(--paper)}
.team p{padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
[contenteditable=true]{outline:1.5px dashed var(--sunset);outline-offset:3px;background:#FFF9EE}
.stage{display:inline-block;font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);padding:4px 9px;border-radius:3px;margin-left:8px;vertical-align:4px}
/* ---------- Lab nav ---------- */
.labnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:-14px 0 26px;padding-bottom:2px}
.labnav::-webkit-scrollbar{display:none}
.labnav a{flex:none;font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
  text-decoration:none;padding:7px 10px;border:1px solid transparent;border-radius:4px;white-space:nowrap}
.labnav a:hover{color:var(--ink);border-color:var(--rule)}
.labnav a.on{color:var(--ink);border-color:var(--ink)}
.labnav a.acct{margin-left:auto;background:var(--ink);color:var(--paper)}
/* ---------- Lab home ---------- */
body.home .sheet{max-width:1040px}
.hero{background:var(--ink);color:var(--paper);margin:0 -52px;padding:46px 52px 40px;position:relative;overflow:hidden}
@media (max-width:640px){.hero{margin:0 -20px;padding:34px 20px 30px}}
.hero .eyebrow{font-family:var(--fm);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#F2C7A8;margin-bottom:14px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.02em;max-width:14ch;color:var(--paper)}
.hero h1 em{font-style:normal;color:var(--sunset)}
.hero p.lead{font-size:17px;line-height:1.55;color:#D9D1C2;max-width:56ch;margin:18px 0 22px}
.hero .actions button,.hero .actions .btn{background:var(--sunset);border-color:var(--sunset);color:#fff;padding:13px 20px;font-size:14px}
.hero .actions .ghost{background:transparent;border-color:#6B5A4E;color:var(--paper)}
.hero .reel{position:absolute;right:-30px;top:30px;width:230px;opacity:.14;pointer-events:none}
@media (max-width:760px){.hero .reel{display:none}}
.proof{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#B9AF9F}
.proof b{color:var(--paper);font-weight:700}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tool{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:20px 20px 18px;display:flex;flex-direction:column;border-radius:2px}
.tool .num{font-family:var(--fm);font-size:10px;letter-spacing:.18em;color:var(--ink-3);margin-bottom:10px}
.tool h3{font-family:var(--fb);font-size:21px;line-height:1.15;margin-bottom:3px}
.tool .tag{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sunset);margin-bottom:10px}
.tool .desc{font-size:14px;line-height:1.55;color:var(--ink-2);flex:1}
.tool .go{margin-top:16px;align-self:flex-start}
.tool.lead{border-top-color:var(--sunset)}
.tool.soon{background:transparent;border-style:dashed;border-top:1px dashed var(--rule)}
.tool.soon h3{color:var(--ink-2)} .tool.soon .tag{color:var(--ink-3)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.steps div{background:var(--card);padding:16px 16px 14px}
.steps b{display:block;font-family:var(--fb);font-size:15px;margin:4px 0 4px}
.steps span{font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:var(--sunset)}
.steps p{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.join{display:grid;grid-template-columns:1fr 1fr;gap:34px;background:var(--card);border:1px solid var(--rule);padding:26px 26px 22px}
@media (max-width:760px){.join{grid-template-columns:1fr;gap:18px;padding:20px 18px}}
.join h3{font-family:var(--fb);font-size:24px;line-height:1.15;margin-bottom:8px}
.join ul{list-style:none;margin-top:12px}
.join li{font-size:14px;padding:6px 0 6px 20px;position:relative;color:var(--ink-2)}
.join li::before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:700}
.join input[type=email],.join input[type=password]{width:100%;font:15px var(--fn);padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.join input[type=text]{background:var(--paper)}
.seg{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin-bottom:4px}
.seg button{flex:1;border:0;border-radius:0;background:transparent;color:var(--ink);padding:10px}
.seg button.on{background:var(--ink);color:var(--paper)}
.banner{background:#FFF3E6;border:1px solid #F0C9A6;border-left:4px solid var(--sunset);padding:13px 16px;margin:0 0 18px;font-size:14px;line-height:1.5}
.banner button{margin-top:8px;padding:7px 12px;font-size:12px}
.work{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.work .box h3{font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin-bottom:4px}
.work .item:first-of-type{border-top:0}
.work .item a{font-size:14px}
.mini{font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
/* talent search */
.tsearch{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr .8fr auto;gap:10px;align-items:end;background:var(--card);border:1px solid var(--rule);padding:14px;margin:16px 0 10px}
@media (max-width:820px){.tsearch{grid-template-columns:1fr 1fr}.tsearch .tq{grid-column:1/-1}}
.tsearch label{margin:0 0 5px}
.tsearch select,.tsearch input{width:100%;font:15px var(--fn);padding:10px 11px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tchips button{padding:6px 12px;font-size:12px;border-radius:999px}
.tchips button.on{background:var(--ink);color:var(--paper)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--rule);text-decoration:none;color:var(--ink);overflow:hidden}
.tcard:hover{border-color:var(--ink)}
.tph{aspect-ratio:4/5;background:#241C18 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--fb);font-size:44px;color:#6B5A4E}
.tbody{padding:12px 14px 14px}
.tbody b{font-size:16px}
.troles{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sunset);margin:4px 0 6px}
.tsrc{display:inline-block;margin-top:8px;font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);padding:3px 7px;color:var(--ink-3)}
.tsrc.on{border-color:var(--green);color:var(--green)}
/* talent profile hero */
.thero{display:grid;grid-template-columns:300px 1fr;gap:34px;background:var(--ink);color:var(--paper);margin:0 -52px;padding:40px 52px}
@media (max-width:760px){.thero{grid-template-columns:1fr;margin:0 -20px;padding:28px 20px;gap:20px}}
.thphoto{aspect-ratio:4/5;background:#241C18 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--fb);font-size:72px;color:#6B5A4E;border-radius:4px}

}

</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <a class="mark" href="/lab">4<em>flieks</em> Lab</a>
    <div class="docref" id="docref">SCRIPT REPORT</div>
  </div>
  <nav class="labnav noprint" id="labnav">
    <a href="/lab" data-k="home">Lab</a>
    <a href="/lab/report" data-k="report">Script Report</a>
    <a href="/script-upload.html" data-k="coach">Script Coach</a>
    <a href="/lab/talent" data-k="talent">Talent</a>
    <a href="/" data-k="watch">Watch films</a>
    <a href="/lab#join" class="acct" id="navAcct">Join free</a>
  </nav>
  <div id="app"><div class="center"><div class="spin"></div><p class="muted">Loading…</p></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCQlHW08a2J3HJRKZr83HhkGS_-wJKbegA",
  authDomain: "flieks-app.firebaseapp.com",
  databaseURL: "https://flieks-app-default-rtdb.firebaseio.com",
  projectId: "flieks-app",
  storageBucket: "flieks-app.firebasestorage.app",
  messagingSenderId: "392470139152",
  appId: "1:392470139152:web:586fa5b8cf3a43acaf9595"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();

const API = '/.netlify/functions/flieks-script-report';
const app = document.getElementById('app');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const call = async (action, extra = {}, withToken = true) => {
  const body = { action, ...extra };
  if (withToken && auth.currentUser) body.token = await auth.currentUser.getIdToken();
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, d };
};
const dateStr = ms => ms ? new Date(ms).toLocaleDateString('en-ZA', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

/* /lab/r/<id> or ?r=<id> is a report; anything else is the workspace. */
const reportId = (location.pathname.match(/^\/lab\/r\/([A-Za-z0-9]+)/) || [])[1] ||
                 new URLSearchParams(location.search).get('r');
const pitchId = (location.pathname.match(/^\/lab\/p\/([A-Za-z0-9]+)/) || [])[1] ||
                new URLSearchParams(location.search).get('p');
/* Wait for sign-in to settle once, so the owner gets their tools. */
const authReady = new Promise(res => { const off = auth.onAuthStateChanged(u => { off(); res(u); }); });

const EMO = {
  joy: ['Joy', '#D9A21B'], hope: ['Hope', '#5E8C3A'], love: ['Love', '#B8457A'], humour: ['Humour', '#E08A2E'],
  tension: ['Tension', '#C2501F'], fear: ['Fear', '#6B4E9B'], sadness: ['Sadness', '#3E6E9E'],
  anger: ['Anger', '#8E2A1B'], surprise: ['Surprise', '#2E8C84']
};
const GENRE_COLORS = ['#17110E', '#C2501F', '#A87515', '#5E564D'];

/* ================= the report ================= */

let pollTimer = null;
async function showReport(id) {
  clearTimeout(pollTimer);
  const { ok, d } = await call('get', { id }, !!auth.currentUser);
  if (!ok) {
    app.innerHTML = `<div class="center"><h1>Report not found</h1><p class="muted">The link may be wrong, or the report was deleted.</p>
      <p style="margin-top:16px"><a class="btn ghost" href="/lab">Go to 4flieks Lab</a></p></div>`;
    return;
  }
  document.getElementById('docref').innerHTML = `SCRIPT REPORT<br>${esc(dateStr(d.finished_at || d.created_at))}`;
  document.title = `${d.title} — Report — 4flieks Lab`;
  if (d.status === 'queued' || d.status === 'working') {
    app.innerHTML = `<div class="center"><div class="spin"></div><h1 style="font-size:26px">${esc(d.title)}</h1>
      <p class="muted" style="margin-top:6px">${esc(d.stage || 'Working…')}</p>
      <p class="tiny" style="margin-top:14px">You can leave this page. The report will be here when it’s done, under your reports in 4flieks Lab.</p></div>`;
    pollTimer = setTimeout(() => showReport(id), 5000);
    return;
  }
  if (d.status === 'error') {
    app.innerHTML = `<div class="center"><h1 style="font-size:26px">${esc(d.title)}</h1>
      <p style="color:var(--sunset);margin-top:8px">${esc(d.error)}</p>
      <p style="margin-top:16px"><a class="btn ghost" href="/lab">Back to 4flieks Lab</a></p></div>`;
    return;
  }
  renderReport(id, d.report);
  if (d.is_owner) ownerPanel(id, d);
  if (d.is_owner) castPanel(id, d.cast_match);
}

/* ================= cast match (owner only) ================= */

let castTimer = null, castData = null;
function castPanel(id, cm) {
  const box = document.getElementById('castbox');
  if (!box) return;
  clearTimeout(castTimer);
  castData = cm;
  const intro = `<p>4flieks suggests actors for these roles from people who have <b>opted in</b> on their talent profile.
    You see their profile and their 4flieks record, never their email. If you ask to connect, they get your message and reply to you directly.</p>`;
  if (!cm || cm.status === 'error') {
    box.innerHTML = `<div class="panel" style="margin:18px 0 6px">
      <h3>Find cast for these roles</h3>${intro}
      ${cm && cm.error ? `<p style="color:#F2C7A8;margin-top:8px">${esc(cm.error)}</p>` : ''}
      <p class="msg" id="cmmsg" style="color:#F2C7A8"></p>
      <div class="actions"><button id="cmgo" onclick="startCast('${esc(id)}')">Find cast</button></div></div>`;
    return;
  }
  if (cm.status === 'queued' || cm.status === 'working') {
    box.innerHTML = `<div class="panel" style="margin:18px 0 6px"><h3>Finding cast…</h3>
      <p>Reading the roles against the actors who opted in. This takes under a minute.</p></div>`;
    castTimer = setTimeout(async () => { const { ok, d } = await call('get', { id }); if (ok) castPanel(id, d.cast_match); }, 4000);
    return;
  }
  const people = cm.people || {}, sent = cm.sent || {};
  const withPicks = (cm.matches || []).filter(m => m.picks && m.picks.length);
  const body = !cm.pool
    ? `<p>No actors have opted in yet. The directory is new: every actor with a cast link on 4flieks can create a profile at
        <a href="/talent">4flieks.com/talent</a>. Send it to actors you know, and search again later.</p>`
    : !withPicks.length
    ? `<p>${cm.pool} ${cm.pool === 1 ? 'actor has' : 'actors have'} opted in so far, but none fit these roles well enough to suggest. Search again as more join.</p>`
    : withPicks.map(m => `<h3 style="margin-top:18px">${esc(m.character)}</h3>` + m.picks.map(p => actorCard(id, m.character, p, people[p.id], sent[p.id])).join('')).join('');
  box.innerHTML = `<div class="panel" style="margin:18px 0 6px">
    <h3>Cast suggestions</h3>
    <p class="tiny" style="color:#B9AF9F">From ${cm.pool || 0} opted-in ${cm.pool === 1 ? 'actor' : 'actors'} · ${esc(dateStr(cm.finished_at))}</p>
    ${body}
    <p class="msg" id="cmmsg" style="color:#F2C7A8"></p>
    <div class="actions"><button class="ghost" id="cmgo" onclick="startCast('${esc(id)}')">Search again</button></div>
    <p class="tiny" style="color:#B9AF9F;margin-top:12px">Suggestions are made by Claude, the AI made by Anthropic, from each actor's own profile
      (playing age, languages, where they are, what they wrote about themselves) and their 4flieks record. It is a shortlist to look at, not an audition.</p>
  </div>`;
}

function actorCard(id, character, pick, a, wasSent) {
  if (!a) return '';
  const rec = a.record || { films: [], clicks: 0, sales: 0 };
  const facts = [a.playing_age && `Plays ${esc(a.playing_age)}`, (a.languages || []).length && esc(a.languages.join(', ')),
    [a.city, a.province, a.country].filter(Boolean).map(esc).join(', ')].filter(Boolean).join(' · ');
  const track = rec.films.length
    ? `${rec.films.map(f => `<i>${esc(f.title)}</i>${f.role ? ' (' + esc(f.role) + ')' : ''}`).join(', ')} · ${rec.clicks} people via their link · ${rec.sales} bought`
    : 'New to 4flieks: no approved credits yet';
  const key = `${a.id}`.replace(/[^A-Za-z0-9_-]/g, '');
  return `<div style="display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px 0;border-top:1px solid #4A3D34">
    <div style="width:72px;height:90px;border-radius:6px;background:#241C18 ${a.photo_url ? `url('${esc(a.photo_url)}') center/cover` : ''}"></div>
    <div>
      <p style="color:var(--paper);font-size:15px"><b>${esc(a.name)}</b>
        <span class="stage" style="border-color:${pick.fit === 'High' ? '#7FBF7F' : '#B9AF9F'};color:${pick.fit === 'High' ? '#9FD89F' : '#D9D1C2'}">${pick.fit === 'High' ? 'Strong fit' : 'Possible fit'}</span></p>
      ${facts ? `<p class="small" style="color:#D9D1C2">${facts}</p>` : ''}
      <p class="small" style="margin-top:6px">${esc(pick.why)}</p>
      <p class="tiny" style="color:#B9AF9F;margin-top:6px">4flieks record: ${track}</p>
      ${a.bio ? `<p class="tiny" style="color:#B9AF9F;margin-top:4px">${esc(a.bio)}</p>` : ''}
      <div class="actions" style="margin-top:10px">
        ${a.showreel ? `<a class="btn ghost" href="${esc(a.showreel)}" target="_blank" rel="noopener">Showreel</a>` : ''}
        ${a.instagram ? `<a class="btn ghost" href="https://instagram.com/${encodeURIComponent(a.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ''}
        ${a.source === 'actorsspaces' ? (a.profile_url ? `<a class="btn" href="${esc(a.profile_url)}" target="_blank" rel="noopener">View on Actors Spaces</a>` : '')
          : wasSent ? `<span class="small" style="color:#9FD89F;align-self:center">Asked to connect ✓</span>`
          : `<button data-rid="${esc(id)}" data-uid="${key}" data-char="${esc(character)}" onclick="connectForm(this)">Ask to connect</button>`}
        ${a.source !== 'actorsspaces' ? `<a class="btn ghost" href="/lab/talent/${esc(a.id)}" target="_blank">Full profile</a>` : ''}
      </div>
      <div class="cform"></div>
    </div></div>`;
}

function connectForm(btn) {
  const id = btn.dataset.rid, uid = btn.dataset.uid, character = btn.dataset.char;
  const box = btn.closest('div').parentElement.querySelector('.cform');
  btn.disabled = true;
  box.innerHTML = `<label>Your message to them</label>
    <textarea maxlength="1200" placeholder="Who you are, the project, the role, dates and whether it is paid.">Hi, I'm casting "${esc(document.title.split(' — ')[0])}" and would like to talk to you about the role of ${esc(character)}. </textarea>
    <p class="tiny" style="color:#B9AF9F;margin-top:6px">4flieks emails this to them. Your email is the reply address, so their answer comes straight to you.</p>
    <p class="msg" style="color:#F2C7A8"></p>
    <div class="actions"><button>Send</button><button class="ghost">Cancel</button></div>`;
  const [send, cancel] = box.querySelectorAll('button');
  const msg = box.querySelector('.msg');
  cancel.onclick = () => { box.innerHTML = ''; btn.disabled = false; };
  send.onclick = async () => {
    send.disabled = true; msg.textContent = 'Sending…';
    const { ok, d } = await call('connect', { id, talentUid: uid, character, message: box.querySelector('textarea').value });
    if (!ok) { send.disabled = false; msg.textContent = d.message || 'Could not send.'; return; }
    box.innerHTML = `<p class="small" style="color:#9FD89F">Sent. If they are interested, they will reply to your email.</p>`;
    btn.outerHTML = `<span class="small" style="color:#9FD89F;align-self:center">Asked to connect ✓</span>`;
  };
}

async function startCast(id) {
  const btn = document.getElementById('cmgo'), msg = document.getElementById('cmmsg');
  btn.disabled = true; msg.textContent = 'Starting…';
  const { ok, d } = await call('match-start', { id });
  if (!ok) { btn.disabled = false; msg.textContent = d.message || 'Could not start.'; return; }
  castPanel(id, { status: 'queued' });
}

/* Only the report's owner sees this: turn the report into a funder pitch. */
function ownerPanel(id, d) {
  const box = document.createElement('div');
  box.className = 'panel noprint';
  box.innerHTML = d.pitch_id ? `
    <h3>Your pitch is ready to share</h3>
    <p>A one-page pitch built from this report. Development notes and scores stay out of it.</p>
    <div class="actions"><a class="btn" style="background:var(--sunset);border-color:var(--sunset);color:#fff" href="/lab/p/${esc(d.pitch_id)}">Open your pitch</a></div>`
  : `
    <h3>Turn this into a pitch</h3>
    <p>A one-page pitch for funders, co-producers and festivals, written from this report. Development notes and scores stay out of it, and you can edit every word before you share it.</p>
    ${pitchForm({ contact: d.owner_email || '' })}
    <p class="msg" id="pmsg" style="color:#F2C7A8"></p>
    <div class="actions"><button id="pgo" onclick="startPitch('${esc(id)}')">Write my pitch</button></div>`;
  app.insertBefore(box, app.firstChild);
}

const STAGES = ['Idea', 'Script', 'Financing', 'Pre-production', 'Shooting', 'Post-production', 'Finished'];
function pitchForm(v) {
  v = v || {};
  return `<div class="row2">
      <div><label for="pstage">Stage</label><select id="pstage">${STAGES.map(x => `<option${(v.stage || 'Script') === x ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
      <div><label for="pcontact">Contact</label><input id="pcontact" type="text" maxlength="160" value="${esc(v.contact || '')}" placeholder="Email or phone"></div>
    </div>
    <label for="pteam">Team (one person per line: name, role, one line about them)</label>
    <textarea id="pteam" maxlength="1500" placeholder="Sabelo Khomo, writer-director, award-winning short Orì&#10;Thandi M, producer, 10 years in commercials">${esc(v.team || '')}</textarea>
    <label for="pask">What you are looking for</label>
    <textarea id="pask" maxlength="800" placeholder="e.g. R250,000 to shoot in March 2027, a co-producer, a cinematographer">${esc(v.ask || '')}</textarea>`;
}
const readForm = () => ({ stage: document.getElementById('pstage').value, contact: document.getElementById('pcontact').value.trim(),
  team: document.getElementById('pteam').value.trim(), ask: document.getElementById('pask').value.trim() });

async function startPitch(id) {
  const btn = document.getElementById('pgo'), msg = document.getElementById('pmsg');
  btn.disabled = true; msg.textContent = 'Starting…';
  const { ok, d } = await call('pitch-start', { id, ...readForm() });
  if (!ok) { btn.disabled = false; msg.textContent = d.message || 'Could not start.'; return; }
  location.href = `/lab/p/${d.pid}`;
}

/* ================= the pitch ================= */

let pitchData = null, editing = false;
async function showPitch(pid) {
  clearTimeout(pollTimer);
  const { ok, d } = await call('pitch-get', { pid }, !!auth.currentUser);
  if (!ok) { gate(`<h1>Pitch not found</h1><p class="muted">The link may be wrong, or it was deleted.</p>`); return; }
  pitchData = d;
  document.getElementById('docref').innerHTML = `PITCH<br>${esc(dateStr(d.updated_at))}`;
  document.title = `${d.title} — Pitch`;
  if (d.status === 'queued' || d.status === 'working') {
    gate(`<div class="spin"></div><h1 style="font-size:26px">${esc(d.title)}</h1><p class="muted" style="margin-top:6px">Writing your pitch… this takes about a minute.</p>`);
    pollTimer = setTimeout(() => showPitch(pid), 5000);
    return;
  }
  if (d.status === 'error' && !d.copy) {
    gate(`<h1 style="font-size:26px">${esc(d.title)}</h1><p style="color:var(--sunset);margin-top:8px">${esc(d.error)}</p>
      ${d.is_owner && d.report_id ? `<p style="margin-top:16px"><a class="btn ghost" href="/lab/r/${esc(d.report_id)}">Back to the report</a></p>` : ''}`);
    return;
  }
  renderPitch(d);
}

const PFIELDS = [['story', 'The story'], ['why_this_film', 'Why this film'], ['why_now', 'Why now'], ['audience', 'Audience'],
  ['look_and_feel', 'Look and feel'], ['production', 'Production'], ['release', 'Release']];

function renderPitch(d) {
  const c = d.copy || {}, det = d.details || {};
  const ed = k => `data-k="${k}"`;
  const team = String(det.team || '').split('\n').map(x => x.trim()).filter(Boolean);
  document.body.classList.add('pitch');
  app.innerHTML = `
    ${d.is_owner ? `<div class="panel noprint" id="ptools">
      <h3>Your pitch</h3>
      <p>Share the link, or save it as a PDF. Edit any text first if you like; the report's development notes and scores are not included.</p>
      <div id="peditform" style="display:none">${pitchForm(det)}</div>
      <p class="msg" id="pmsg" style="color:#F2C7A8"></p>
      <div class="actions">
        <button id="pedit" onclick="toggleEdit()">Edit text</button>
        <button class="ghost" onclick="copyPitchLink(this)">Copy link</button>
        <button class="ghost" onclick="window.print()">Save as PDF</button>
        <button class="ghost" onclick="rewritePitch()">Rewrite with AI</button>
        ${d.report_id ? `<a class="btn ghost" style="color:var(--paper);border-color:#6B5A4E" href="/lab/r/${esc(d.report_id)}">Back to the report</a>` : ''}
      </div></div>` : ''}
    <h1>${esc(d.title)}${det.stage ? `<span class="stage">${esc(det.stage)}</span>` : ''}</h1>
    ${d.writer ? `<p class="meta">WRITTEN BY ${esc(d.writer).toUpperCase()}</p>` : ''}
    ${c.headline ? `<p class="headline" ${ed('headline')}>${esc(c.headline)}</p>` : ''}
    ${c.logline ? `<p class="logline" ${ed('logline')}>${esc(c.logline)}</p>` : ''}
    ${(c.key_facts || []).length ? `<div class="kf">${c.key_facts.map(f => `<div><b>${esc(f.label)}</b><span>${esc(f.value)}</span></div>`).join('')}</div>` : ''}
    <div class="pgrid">
      ${PFIELDS.filter(([k]) => c[k]).map(([k, n]) => `<div><h2>${n}</h2><p ${ed(k)}>${esc(c[k])}</p></div>`).join('')}
      ${(c.comparables || []).length ? `<div><h2>Comparable titles</h2>${c.comparables.map(x => `<p class="small" style="margin-bottom:6px"><b>${esc(x.title)}</b>${x.year ? ` (${x.year})` : ''}${x.note ? ` — ${esc(x.note)}` : ''}</p>`).join('')}</div>` : ''}
    </div>
    ${team.length ? `<h2>The team</h2><div class="team">${team.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : ''}
    ${det.ask || det.contact ? `<div class="ask">
      ${det.ask ? `<h2>What we're looking for</h2><p>${esc(det.ask)}</p>` : ''}

function arcSvg(arc) {
  if (!arc.length) return '';
  const W = 760, H = 230, L = 34, R = 12, T = 14, B = 26;
  const iw = W - L - R, ih = H - T - B;
  const x = i => L + (arc.length === 1 ? iw / 2 : i * iw / (arc.length - 1));
  const yI = v => T + ih - (v / 10) * ih;                // intensity 0..10
  const yV = v => T + ih / 2 - (v / 5) * (ih / 2);        // valence -5..5
  const area = `M${x(0)},${yI(0)} ` + arc.map((p, i) => `L${x(i)},${yI(p.intensity)}`).join(' ') + ` L${x(arc.length - 1)},${yI(0)} Z`;
  const line = arc.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${yV(p.valence)}`).join(' ');
  const grid = [0, 5, 10].map(v => `<line x1="${L}" x2="${W - R}" y1="${yI(v)}" y2="${yI(v)}" stroke="#D9D1C2" stroke-width="1"/>
     <text x="${L - 8}" y="${yI(v) + 4}" font-size="10" text-anchor="end" fill="#8A8177" font-family="JetBrains Mono,monospace">${v}</text>`).join('');
  const dots = arc.map((p, i) => `<circle cx="${x(i)}" cy="${yI(p.intensity)}" r="6" fill="${(EMO[p.emotion] || EMO.tension)[1]}" stroke="#FBF8F1" stroke-width="2">
     <title>${esc(`${p.n}. ${p.moment} (${(EMO[p.emotion] || EMO.tension)[0]}, intensity ${p.intensity}/10)`)}</title></circle>`).join('');
  const labels = arc.map((p, i) => (arc.length <= 14 || i % 2 === 0) ?
    `<text x="${x(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#8A8177" font-family="JetBrains Mono,monospace">${p.n}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Emotion arc: intensity of each key moment across the script, with the emotional tone line">
    ${grid}
    <path d="${area}" fill="#C2501F" fill-opacity=".12" stroke="none"/>
    <path d="${arc.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${yI(p.intensity)}`).join(' ')}" fill="none" stroke="#C2501F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${line}" fill="none" stroke="#17110E" stroke-width="1.5" stroke-dasharray="5 4"/>
    ${dots}${labels}</svg>`;
}

      <p id="dropText">Tap to choose a PDF, Word or text file, or drop it here</p>
      <input id="f" type="file" accept="application/pdf,.pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.txt,text/plain" style="display:none">
    </div>
    <p class="tiny" style="margin-top:8px"><a href="#" onclick="togglePaste();return false" style="color:var(--sunset)" id="pasteLink">Or paste the text instead</a></p>
    <textarea id="paste" placeholder="Paste your story, treatment or synopsis here" style="display:none;width:100%;min-height:220px;margin-top:8px;font:15px/1.5 var(--fn);padding:12px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink)"></textarea>

    <p class="tiny" id="quota" style="margin-top:10px"></p>

    <h2>Your reports</h2>
    <div id="list"><p class="tiny">Loading…</p></div>`;
  const f = document.getElementById('f'), drop = document.getElementById('drop');
  f.addEventListener('change', () => pick(f.files[0]));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('has'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('has'));
  drop.addEventListener('drop', e => { e.preventDefault(); pick(e.dataTransfer.files[0]); });
}

function pick(file) {
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';
  chosen = null;
  if (!file) return;
  if (!/\.(pdf|docx|txt)$/i.test(file.name)) { msg.className = 'msg err'; msg.textContent = 'Please choose a PDF, a Word document (.docx) or a text file. Older .doc files: save as .docx first.'; return; }
  if (file.size > 30 * 1024 * 1024) { msg.className = 'msg err'; msg.textContent = 'That file is over 30MB.'; return; }
  chosen = file;
  document.getElementById('drop').classList.add('has');
  document.getElementById('dropText').textContent = `${file.name} · ${(file.size / 1048576).toFixed(1)}MB`;
  const t = document.getElementById('t');
  if (!t.value.trim()) t.value = file.name.replace(/\.(pdf|docx|txt)$/i, '').replace(/[_-]+/g, ' ').trim();
  const box = document.getElementById('paste'); if (box.style.display !== 'none') togglePaste();
}

async function startReport() {
  const msg = document.getElementById('msg'), go = document.getElementById('go');
  const title = document.getElementById('t').value.trim(), writer = document.getElementById('w').value.trim();
  msg.className = 'msg err';
  const pasted = document.getElementById('paste').style.display !== 'none' ? document.getElementById('paste').value.trim() : '';
  if (!title) { msg.textContent = 'Give it a title.'; return; }
  if (!chosen && !pasted) { msg.textContent = 'Choose a file, or paste the text.'; return; }

  // Word, text and pasted writing are read here and sent as text; PDFs go to private storage.
  if (pasted || !/\.pdf$/i.test(chosen.name)) {
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Reading your file…';
    try {
      let text = pasted, source = 'paste';
      if (!pasted && /\.txt$/i.test(chosen.name)) { text = await chosen.text(); source = 'txt'; }
      else if (!pasted) { text = await docxText(chosen); source = 'docx'; }
      if (text.replace(/\s+/g, '').length < 400) throw new Error('That is too short to report on. Use the full story or treatment.');
      if (text.length > 400000) throw new Error('That is too long to send as text. Try a PDF, or the first part.');
      msg.textContent = 'Starting the read…';
      const { ok, d } = await call('start', { title, writer, text, source, fileName: chosen ? chosen.name : 'pasted text' });
      if (!ok) throw new Error(d.message || 'Could not start.');
      location.href = `/lab/r/${d.id}`;
    } catch (e) {
      msg.className = 'msg err'; msg.textContent = e.message || 'Could not read that file.'; go.disabled = false;
    }
    return;
  }

  go.disabled = true; msg.className = 'msg'; msg.textContent = 'Uploading…';
  const uid = auth.currentUser.uid;
  const rand = Math.random().toString(36).slice(2, 8);
  const ref = firebase.storage().ref(`flieks_scripts/lab_${uid}/${Date.now()}-${rand}.pdf`);
  const prog = document.getElementById('prog'), bar = document.getElementById('progBar');
  prog.style.display = 'block';
  try {
    const task = ref.put(chosen, { contentType: 'application/pdf', customMetadata: { owner: uid } });
    task.on('state_changed', s => { bar.style.width = Math.round(s.bytesTransferred / s.totalBytes * 100) + '%'; });
    await task;
    const fileUrl = await ref.getDownloadURL();
    msg.textContent = 'Starting the read…';
    const { ok, d } = await call('start', { title, writer, fileUrl, fileName: chosen.name });
    if (!ok) throw new Error(d.message || 'Could not start.');
    location.href = `/lab/r/${d.id}`;
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e.message || 'Upload failed. Try again.';
    go.disabled = false; prog.style.display = 'none'; bar.style.width = '0';
  }
}

function togglePaste() {
  const box = document.getElementById('paste'), link = document.getElementById('pasteLink'), drop = document.getElementById('drop');
  const show = box.style.display === 'none';
  box.style.display = show ? 'block' : 'none';
  drop.style.display = show ? 'none' : 'block';
  link.textContent = show ? 'Upload a file instead' : 'Or paste the text instead';
  if (show) { chosen = null; box.focus(); }
}

/* Word documents are read in the browser with mammoth, loaded only when needed. */
function docxText(file) {
  const load = window.mammoth ? Promise.resolve() : new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
    sc.onload = res; sc.onerror = () => rej(new Error('Could not load the Word reader. Check your connection, or export a PDF.'));
    document.head.appendChild(sc);
  });
  return load.then(() => file.arrayBuffer()).then(buf => mammoth.extractRawText({ arrayBuffer: buf })).then(r => r.value || '');
}

async function loadList() {
  const el = document.getElementById('list'), q = document.getElementById('quota');
  const { ok, d } = await call('list');
  if (!ok) { el.innerHTML = `<p class="tiny">${esc(d.message || 'Could not load your reports.')}</p>`; return; }
  if (d.limit) q.textContent = `${Math.max(0, d.limit - d.used)} of ${d.limit} reports left this month.`;
  if (!d.items.length) { el.innerHTML = `<p class="tiny">None yet. Your reports will be listed here.</p>`; return; }
  const label = s => ({ queued: 'Starting', working: 'Reading…', done: 'Ready', error: 'Failed' }[s.status] || s.status) + (s.verdict ? ` · ${s.verdict}` : '');
  el.innerHTML = d.items.map(r => `<div class="item">
      <div><a href="/lab/r/${esc(r.id)}">${esc(r.title)}</a><div class="st">${esc(label(r))} · ${esc(dateStr(r.created_at))}</div></div>
      <button class="danger" onclick="removeReport('${esc(r.id)}', this)">Delete</button></div>`).join('');
}

async function removeReport(id, btn) {
  // Two taps: the first arms it, the second deletes.
  if (!btn.dataset.armed) {
    btn.dataset.armed = '1'; btn.textContent = 'Tap again to delete';
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Delete'; } }, 4000);
    return;
  }
  btn.disabled = true; btn.textContent = 'Deleting…';
  const { ok, d } = await call('delete', { id });
  if (ok && d.filePath) { try { await firebase.storage().ref(d.filePath).delete(); } catch (e) { /* file may already be gone */ } }
  if (!ok) { btn.disabled = false; delete btn.dataset.armed; btn.textContent = d.message || 'Could not delete'; return; }
  loadList();
}

        <div class="actions"><a class="btn ghost" href="/script-upload.html">Upload a script</a></div></div>
      <div class="box"><h3>Talent profile</h3>
        ${tp ? `<p class="small" style="margin:8px 0 4px"><b>${esc(tp.name)}</b></p>
            <p class="small muted">${tp.suggest ? 'Suggestions on: filmmakers can find you.' : 'Suggestions off: your profile is private.'}
              ${Object.keys(tp.credits || {}).length} approved credit${Object.keys(tp.credits || {}).length === 1 ? '' : 's'}.</p>`
          : `<p class="small muted" style="margin:10px 0">Act or work on crew? Make a profile and choose whether filmmakers can find you.</p>`}
        <div class="actions"><a class="btn ghost" href="/talent">${tp ? 'Edit profile' : 'Make my profile'}</a></div>
        <p class="tiny" style="margin-top:14px">Signed in as ${esc(auth.currentUser.email)} · <a href="#" onclick="auth.signOut();return false" style="color:var(--ink-2)">Sign out</a></p></div>
    </div>`;
}

function startHome(user) { setNav(user, 'home'); showHome(user); if (user) loadWork(); }

/* ================= talent search and profiles ================= */

const DISCIPLINES = ['Actor', 'Director', 'Writer', 'Producer', 'Camera / DOP', 'Editor', 'Sound', 'Production design', 'Wardrobe', 'Make-up', 'Music', 'Other crew'];
const TCHIPS = [['Actor', 'Actors'], ['Director', 'Directors'], ['Writer', 'Writers'], ['Producer', 'Producers'], ['Camera / DOP', 'DOPs'], ['Editor', 'Editors'], ['Sound', 'Sound']];
const TCOUNTRIES = ['South Africa', 'Nigeria', 'Kenya', 'Ghana', 'Zimbabwe', 'Namibia', 'Botswana', 'Uganda', 'Tanzania', 'Rwanda', 'Zambia', 'Egypt', 'Morocco', 'Senegal', 'Cameroon', 'Ethiopia', 'Outside Africa'];
const tcall = async (action, extra = {}) => {
  const token = await auth.currentUser.getIdToken();
  const r = await fetch('/.netlify/functions/flieks-talent', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, token, ...extra }) });
  return { ok: r.ok, status: r.status, d: await r.json().catch(() => ({})) };
};
const where = c => [c.city, c.province, c.country].filter(Boolean).join(', ');
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

let tFilters = { q: '', discipline: '', country: '', language: '', age: '' };
function talentSearch() {
  document.body.classList.add('home');
  document.getElementById('docref').innerHTML = 'TALENT<br>SEARCH';
  document.title = 'Talent search — 4flieks Lab';
  const q = new URLSearchParams(location.search);
  ['q', 'discipline', 'country', 'language', 'age'].forEach(k => { if (q.get(k)) tFilters[k] = q.get(k); });
  app.innerHTML = `
    <h1>Talent search</h1>
    <p class="muted" style="margin-bottom:6px">Actors, directors and crew who asked to be found. You see their profile and work, never their email:
      message them here and their reply comes straight to you.</p>
    <p class="small"><a href="/talent" style="color:var(--sunset)">Make or edit your own profile →</a></p>
    <form class="tsearch" onsubmit="event.preventDefault();runSearch()">
      <div class="tq"><label for="tq">Name or keyword</label><input id="tq" type="text" maxlength="80" placeholder="e.g. Thabo, or 'Durban editor'" value="${esc(tFilters.q)}"></div>
      <div><label for="td">What they do</label><select id="td"><option value="">Everyone</option>${DISCIPLINES.map(x => `<option${tFilters.discipline === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div><label for="tc">Country</label><select id="tc"><option value="">Anywhere</option>${TCOUNTRIES.map(x => `<option${tFilters.country === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div><label for="tl">Language</label><input id="tl" type="text" maxlength="30" placeholder="e.g. isiZulu" value="${esc(tFilters.language)}"></div>
      <div><label for="ta">Can play age</label><input id="ta" type="number" min="1" max="99" placeholder="e.g. 30" value="${esc(tFilters.age)}"></div>
      <div class="tgo"><button type="submit">Search</button></div>
    </form>
    <div id="tchips" class="tchips">${TCHIPS.map(([x, label]) => `<button type="button" data-d="${esc(x)}" class="ghost${tFilters.discipline === x ? ' on' : ''}" onclick="document.getElementById('td').value=this.dataset.d;runSearch()">${label}</button>`).join('')}</div>
    <div id="tres"><p class="tiny">Searching…</p></div>`;
  runSearch();
}
async function runSearch() {
  tFilters = { q: document.getElementById('tq').value.trim(), discipline: document.getElementById('td').value, country: document.getElementById('tc').value,
    language: document.getElementById('tl').value.trim(), age: document.getElementById('ta').value };
  const qs = new URLSearchParams(Object.entries(tFilters).filter(([, v]) => v));
  history.replaceState(null, '', '/lab/talent' + (qs.toString() ? '?' + qs : ''));
  document.querySelectorAll('#tchips button').forEach(b => b.classList.toggle('on', b.dataset.d === tFilters.discipline));
  const box = document.getElementById('tres');
  box.innerHTML = '<p class="tiny">Searching…</p>';
  const { ok, d } = await tcall('search', tFilters);
  if (!ok) { box.innerHTML = `<div class="banner">${esc(d.message || 'Could not search just now.')}</div>`; return; }
  if (!d.results.length) {
    box.innerHTML = `<p class="muted" style="padding:20px 0">Nobody matches that yet. Try fewer filters. The directory is new and grows as people join: send actors and crew to <a href="/talent" style="color:var(--sunset)">4flieks.com/talent</a>.</p>`;
    return;
  }
  box.innerHTML = `<p class="tiny" style="margin:6px 0 10px">${d.results.length} ${d.results.length === 1 ? 'person' : 'people'}${d.sources && d.sources.actorsSpaces ? ' · including Actors Spaces' : ''}</p>
    <div class="tgrid">${d.results.map(c => `<a class="tcard" href="/lab/talent/${encodeURIComponent(c.id)}">
      <div class="tph" style="${c.photo_url ? `background-image:url('${esc(c.photo_url)}')` : ''}">${c.photo_url ? '' : esc(initials(c.name))}</div>
      <div class="tbody"><b>${esc(c.name)}</b>
        <p class="troles">${esc((c.disciplines || []).join(' · '))}</p>
        <p class="tiny">${esc(where(c))}${c.playing_age ? ` · plays ${esc(c.playing_age)}` : ''}</p>
        ${(c.languages || []).length ? `<p class="tiny">${esc(c.languages.join(', '))}</p>` : ''}
        ${c.source === 'actorsspaces' ? '<span class="tsrc">via Actors Spaces</span>' : (c.record && c.record.films.length ? `<span class="tsrc on">${c.record.films.length} on 4flieks</span>` : '')}
      </div></a>`).join('')}</div>`;
}

async function talentProfile(id) {
  document.body.classList.add('home');
  document.getElementById('docref').innerHTML = 'TALENT<br>PROFILE';
  app.innerHTML = '<div class="center"><div class="spin"></div></div>';
  const { ok, d } = await tcall('profile', { id });
  if (!ok) { gate(`<h1>Profile not found</h1><p class="muted" style="margin:8px 0 18px">${esc(d.message || 'It may be private now.')}</p><a class="btn ghost" href="/lab/talent">Back to talent search</a>`); return; }
  const c = d.profile, rec = c.record || { films: [], clicks: 0, sales: 0 };
  document.title = `${c.name} — 4flieks Lab`;
  const external = c.source === 'actorsspaces';
  app.innerHTML = `
    <p class="small noprint" style="margin-bottom:12px"><a href="/lab/talent" style="color:var(--ink-2)">← Talent search</a></p>
    ${d.mine && d.hidden ? `<div class="banner">This is how your profile will look. It's private right now: switch on "Show me in the talent search" in <a href="/talent">your profile</a> for others to find it.</div>` : ''}
    <section class="thero">
      <div class="thphoto" style="${c.photo_url ? `background-image:url('${esc(c.photo_url)}')` : ''}">${c.photo_url ? '' : esc(initials(c.name))}</div>
      <div class="thtext">
        <p class="eyebrow">${esc((c.disciplines || []).join(' · ') || 'Talent')}</p>
        <h1>${esc(c.name)}</h1>
        <p class="thfacts">${[esc(where(c)), c.playing_age && `Plays ${esc(c.playing_age)}`, (c.languages || []).length && esc(c.languages.join(', '))].filter(Boolean).map(x => `<span>${x}</span>`).join('')}</p>
        ${c.bio ? `<p class="thbio">${esc(c.bio)}</p>` : ''}
        <div class="actions">
          ${external ? (c.profile_url ? `<a class="btn" href="${esc(c.profile_url)}" target="_blank" rel="noopener">View on Actors Spaces</a>` : '')
            : d.mine ? `<a class="btn" href="/talent">Edit my profile</a>` : `<button onclick="talentContactForm('${esc(c.id)}')" id="tcbtn">${d.contacted_at ? 'Message again' : 'Send a message'}</button>`}
          ${c.imdb ? `<a class="btn ghost" href="${esc(c.imdb)}" target="_blank" rel="noopener">IMDb</a>` : ''}
          ${c.showreel ? `<a class="btn ghost" href="${esc(c.showreel)}" target="_blank" rel="noopener">Showreel</a>` : ''}
          ${c.instagram ? `<a class="btn ghost" href="https://instagram.com/${encodeURIComponent(c.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ''}
        </div>
        <div id="tcform"></div>
        ${d.contacted_at ? `<p class="tiny" style="color:#B9AB9B;margin-top:8px">You messaged them on ${esc(dateStr(d.contacted_at))}.</p>` : ''}
      </div>
    </section>
    ${(c.work || []).length ? `<h2>Featured work</h2>
      <div class="twork">${c.work.map(w => `<a class="tw" href="${esc(w.url)}" target="_blank" rel="noopener">
        <span class="twk">${esc(w.kind || 'Film')}${w.year ? ` · ${w.year}` : ''}</span><b>${esc(w.title)}</b>${w.role ? `<span class="small muted">${esc(w.role)}</span>` : ''}<span class="twgo">Watch or read →</span></a>`).join('')}</div>` : ''}
    ${rec.films.length ? `<h2>On 4flieks</h2>
      <div class="facts"><div><p class="n">${rec.films.length}</p><p class="k">Films</p></div><div><p class="n">${rec.clicks}</p><p class="k">People their link brought in</p></div><div><p class="n">${rec.sales}</p><p class="k">Bought via their link</p></div></div>
      <ul class="plain" style="margin-top:10px">${rec.films.map(f => `<li><b>${esc(f.title)}</b>${f.role ? ` — ${esc(f.role)}` : ''}</li>`).join('')}</ul>` : ''}
    <p class="tiny" style="margin-top:26px">${external ? 'This profile comes from Actors Spaces. Contact and bookings go through them.' : 'Profiles are written by the people themselves. 4flieks never shows anyone\'s email: messages are sent by email and replies go straight to you.'}</p>`;
}
function talentContactForm(id) {
  const box = document.getElementById('tcform');
  document.getElementById('tcbtn').disabled = true;
  box.innerHTML = `<div class="panel" style="margin:14px 0 0">
    <label>Your message</label>
    <textarea id="tcmsg" maxlength="1200" placeholder="Who you are, the project, the role or job, dates and whether it is paid."></textarea>
    <p class="tiny" style="color:#B9AB9B;margin-top:6px">4flieks emails this to them. Your email is the reply address, so their answer comes straight to you.</p>
    <p class="msg" id="tcm" style="color:#F2C7A8"></p>
    <div class="actions"><button id="tcsend">Send</button><button class="ghost" id="tccancel">Cancel</button></div></div>`;
  document.getElementById('tccancel').onclick = () => { box.innerHTML = ''; document.getElementById('tcbtn').disabled = false; };
  document.getElementById('tcsend').onclick = async () => {
    const b = document.getElementById('tcsend'), m = document.getElementById('tcm');
    b.disabled = true; m.textContent = 'Sending…';
    const { ok, d } = await tcall('contact', { id, message: document.getElementById('tcmsg').value });
    if (!ok) { b.disabled = false; m.textContent = d.message || 'Could not send.'; return; }
    box.innerHTML = `<p style="color:#2E7D32;margin-top:12px"><b>Sent.</b> If they're interested, they'll reply to your email.</p>`;
  };
}

/* ================= routing ================= */

if (pitchId) {
  setNav(null, 'report');
  authReady.then(u => { setNav(u, 'report'); showPitch(pitchId); });
} else if (reportId) {
  setNav(null, 'report');
  authReady.then(u => { setNav(u, 'report'); showReport(reportId); });
} else if (talentMatch) {
  auth.onAuthStateChanged(user => {
    setNav(user, 'talent');
    if (!user) { gate(`<h1>Talent search</h1><p class="muted" style="margin:8px 0 18px">Find actors, directors and crew across Africa. Free in 4flieks Lab.</p>
      <a class="btn" href="/lab#join">Join or sign in</a>`); return; }
    if (talentMatch[1]) talentProfile(decodeURIComponent(talentMatch[1])); else talentSearch();
  });
} else if (isReportTool) {
  auth.onAuthStateChanged(async user => {
    setNav(user, 'report');
    if (!user) {
      gate(`<h1>Script Report</h1><p class="muted" style="margin:8px 0 18px">Expert-style coverage for your screenplay or story. Free in 4flieks Lab.</p>
        <a class="btn" href="/lab#join">Join or sign in</a>`);
      return;
    }
    workspaceShell();
    const { ok, d } = await call('list');
    if (ok) { const b = verifyBanner(d); if (b) app.insertAdjacentHTML('afterbegin', b); }
    loadList();
  });
} else {
  auth.onAuthStateChanged(user => { if (joining) return; startHome(user); });
}
</script>
</body>
</html>
