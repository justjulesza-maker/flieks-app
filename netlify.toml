# Per-film link previews. Without this the WhatsApp and Instagram card is the
# same generic 4flieks image whatever film the link points at.
[[edge_functions]]
  function = "og"
  path = "/*"

# Some browsers refuse a manifest served as plain text.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
