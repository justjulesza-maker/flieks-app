[functions]
  node_bundler = "esbuild"

[functions."script-extract-background"]
  timeout = 900

[functions."script-report-background"]
  timeout = 900

[functions."pitch-writer-background"]
  timeout = 900

[functions."cast-match-background"]
  timeout = 900

[functions."festivals-background"]
  timeout = 900

[functions."funding-background"]
  timeout = 900

[functions."watch-notify-background"]
  timeout = 900

[functions."backup-background"]
  timeout = 900

[functions."crm-send-background"]
  timeout = 900

[functions."budget-import-background"]
  timeout = 900

[functions."schedule-breakdown-background"]
  timeout = 900

[functions."line-coach"]
  timeout = 10

# Connecting a podcast RSS feed imports every episode in one request.
[functions."flieks-podcasts"]
  timeout = 26

# Control centre agent. 05:00 UTC is 07:00 in Johannesburg.
[functions."flieks-ops-daily"]
  schedule = "0 5 * * *"

[functions."flieks-ops-watch"]
  schedule = "*/15 * * * *"

[functions."flieks-news-refresh"]
  schedule = "17 */3 * * *"

# Podcast channels that follow an RSS feed pick up new episodes.
[functions."flieks-podcasts-rss"]
  schedule = "41 */3 * * *"

# Full database backup every night. 00:30 UTC is 02:30 in Johannesburg.
[functions."flieks-backup-nightly"]
  schedule = "30 0 * * *"

# CRM: Monday's "new on 4flieks this week" draft. 04:00 UTC is 06:00 in Johannesburg.
# It only drafts; an admin sends it from /crm.
[functions."flieks-crm-weekly"]
  schedule = "0 4 * * 1"
