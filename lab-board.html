<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opportunities board — 4flieks Lab</title>
<meta name="description" content="Casting calls, crew calls and collaborators for African film. Free to apply. From 4flieks Lab.">
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/svg/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F0E6; --card:#FBF8F1; --ink:#17110E; --ink-2:#5E564D; --ink-3:#8A8177;
  --rule:#D9D1C2; --sunset:#C2501F; --ochre:#A87515; --green:#2E7D32; --red:#B3261E;
  --fb:'Archivo Black',sans-serif; --fn:'DM Sans',system-ui,sans-serif; --fm:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8E2D4;color:var(--ink);font-family:var(--fn);padding:28px 14px 70px;-webkit-font-smoothing:antialiased}
.sheet{position:relative;max-width:1040px;margin:0 auto;background:var(--paper);padding:46px 52px 40px;box-shadow:0 1px 3px rgba(23,17,14,.08),0 12px 40px rgba(23,17,14,.09)}
.sheet::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--sunset) 0 15px,transparent 15px 24px)}
@media (max-width:640px){body{padding:0 0 60px}.sheet{padding:34px 16px 30px}}
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:28px}
.mark{font-family:var(--fb);font-size:15px;color:var(--ink);text-decoration:none}
.mark em{color:var(--sunset);font-style:normal}
.docref{font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);text-align:right;line-height:1.7}
.labnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:-14px 0 26px;padding-bottom:2px}
.labnav::-webkit-scrollbar{display:none}
.labnav a{flex:none;font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;padding:7px 10px;border:1px solid transparent;border-radius:4px;white-space:nowrap}
.labnav a:hover{color:var(--ink);border-color:var(--rule)}
.labnav a.on{color:var(--ink);border-color:var(--ink)}
.labnav a.acct{margin-left:auto;background:var(--ink);color:var(--paper)}
h1{font-family:var(--fb);font-size:34px;line-height:1.1;letter-spacing:-.015em;margin-bottom:8px}
h2{font-family:var(--fm);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sunset);margin:30px 0 12px}
h3{font-size:16px;font-weight:700;margin-bottom:4px}
p{font-size:15px;line-height:1.6}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3);line-height:1.55}
.lead{font-size:16px;color:var(--ink-2);max-width:640px}
a{color:var(--sunset)}
button,.btn{font:700 13px var(--fn);padding:10px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button.ghost,.btn.ghost{background:transparent;color:var(--ink)}
button.sm,.btn.sm{padding:6px 10px;font-size:12px}
button.danger,.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
button.go,.btn.go{background:var(--sunset);border-color:var(--sunset);color:#fff}
button:disabled{opacity:.5;cursor:default}
button.link{background:none;border:0;padding:0;color:var(--ink-2);font-weight:500;text-decoration:underline;font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.45}
label.chk input{margin-top:3px;accent-color:var(--sunset);width:16px;height:16px;flex:none}
input[type=text],input[type=date],input[type=number],input[type=url],input:not([type]),select,textarea{width:100%;font:15px var(--fn);padding:10px 11px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);letter-spacing:0;text-transform:none;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--card);border:1px solid var(--rule);padding:16px 18px;border-radius:2px}
.banner{background:#FFF3E6;border:1px solid #F0C9A6;border-left:4px solid var(--sunset);padding:13px 16px;margin:0 0 18px;font-size:14px;line-height:1.5}
.banner.ok{background:#EEF6EE;border-color:#BFDDBF;border-left-color:var(--green)}
.center{text-align:center;padding:40px 0}
.spin{width:28px;height:28px;border:3px solid var(--rule);border-top-color:var(--sunset);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--ink);border-radius:3px;white-space:nowrap;color:var(--ink)}
.chip.dark{background:var(--ink);color:var(--paper)}
.chip.sun{background:var(--sunset);border-color:var(--sunset);color:#fff}
.chip.green{background:var(--green);border-color:var(--green);color:#fff}
.chip.soft{border-color:var(--rule);color:var(--ink-2)}
.chip.warn{border-color:var(--red);color:var(--red)}
/* filters + cards */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--rule);padding:14px;margin:18px 0 16px;align-items:end}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.industry{margin-top:34px;border-top:1px solid var(--rule);padding-top:18px}
.industry h2{font-family:var(--fm);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sunset);margin-bottom:4px}
.industry ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.industry li{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.industry li a{color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.4}
.industry li a:hover{text-decoration:underline;text-decoration-color:var(--sunset)}
.industry li a::after{content:' ↗';color:var(--sunset);font-weight:400}
.industry .src{font-size:12px;color:var(--ink-3)}
.segs button{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:500}
.segs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.post{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);border-radius:2px}
.post:hover{border-top-color:var(--sunset)}
.post.casting{border-top-color:var(--sunset)}
.post h3{font-family:var(--fb);font-size:19px;font-weight:400;line-height:1.2}
.post .meta{font-size:13px;color:var(--ink-2)}
.post .roles{font-size:13px;color:var(--ink-2);flex:1}
.post .foot{display:flex;justify-content:space-between;gap:8px;font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:8px}
/* detail */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:18px 0}
.facts div{background:var(--card);padding:11px 13px}
.facts b{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-bottom:3px}
.facts span{font-size:14px;font-weight:700}
.synopsis{white-space:pre-line;font-size:15.5px;line-height:1.65;max-width:720px}
.role{background:var(--card);border:1px solid var(--rule);padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:start}
@media (max-width:640px){.role{grid-template-columns:1fr}}
.role .desc{font-size:14px;color:var(--ink-2);white-space:pre-line;margin-top:6px;line-height:1.55}
.role .rmeta{font-size:13px;color:var(--ink-2);margin-top:4px}
.spot{background:var(--ink);color:var(--paper);padding:16px 18px;margin:18px 0;border-radius:4px;font-size:14px;line-height:1.55}
.spot b{color:#F2C7A8}
.safety{border-left:3px solid var(--ochre);padding:6px 0 6px 12px;font-size:13px;color:var(--ink-2);margin:20px 0}
/* editor */
.redit{background:var(--card);border:1px solid var(--rule);padding:14px;margin-bottom:10px}
.redit .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
/* manager */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin:14px 0}
.tabs button{background:transparent;color:var(--ink-2);border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 12px;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--sunset)}
.app{background:var(--card);border:1px solid var(--rule);padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:72px 1fr;gap:14px}
@media (max-width:560px){.app{grid-template-columns:1fr}}
.app .ph{width:72px;height:72px;border-radius:50%;background:#E4DCCB center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--fb);font-size:24px;color:var(--ink-3)}
.app .qa{font-size:13.5px;margin-top:8px}
.app .qa b{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
.app .qa p{white-space:pre-line;font-size:14px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);flex-wrap:wrap}
.item a.t{color:var(--ink);font-weight:700;text-decoration:none}
.st{font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(23,17,14,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
.modal{background:var(--paper);border-radius:6px;width:100%;max-width:560px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h3{font-family:var(--fb);font-size:22px;font-weight:400}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-weight:700;font-size:13px;z-index:200;transition:.2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <a class="mark" href="/lab">4<em>flieks</em> Lab</a>
    <div class="docref" id="docref">OPPORTUNITIES<br>BOARD</div>
  </div>
  <nav class="labnav" id="labnav">
    <a href="/lab">Lab</a>
    <a href="/lab/board" class="on">Board</a>
    <a href="/lab/report">Script Report</a>
    <a href="/lab/talent">Talent</a>
    <a href="/lab/budget">Budget</a>
    <a href="/lab#join" class="acct" id="navAcct">Join free</a>
  </nav>
  <div id="app"><div class="center"><div class="spin"></div><p class="muted">Loading…</p></div></div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script>
'use strict';
/* Sign-in only: this page never talks to the database. Everything goes through
   /.netlify/functions/flieks-board, which checks who is asking. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCQlHW08a2J3HJRKZr83HhkGS_-wJKbegA",
  authDomain: "flieks-app.firebaseapp.com",
  databaseURL: "https://flieks-app-default-rtdb.firebaseio.com",
  projectId: "flieks-app",
  storageBucket: "flieks-app.firebasestorage.app",
  messagingSenderId: "392470139152",
  appId: "1:392470139152:web:586fa5b8cf3a43acaf9595"
};
const API = '/.netlify/functions/flieks-board';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));   // quote-safe (audit C2)
const safeUrl = u => /^https:\/\/[^\s"'<>()\\]+$/i.test(String(u || '')) ? String(u) : '';
const rid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dstr = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const R = n => 'R ' + Math.round(n || 0).toLocaleString('en-ZA');
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 3000); }
const daysLeft = d => Math.round((new Date(d + 'T23:59:59') - new Date()) / 864e5);

const KIND = { casting: 'Casting call', crew: 'Crew call', collab: 'Collaborators' };
const PAY = { paid: 'Paid', deferred: 'Deferred pay', profit_share: 'Profit share', unpaid: 'Unpaid' };
const PAY_HELP = { paid: 'Paid on the job', deferred: 'Paid later, from what the film earns, as agreed in writing', profit_share: 'A share of the film\'s profit, as agreed in writing', unpaid: 'No pay. Say what people get: credit, meals, footage, experience' };
const RTYPE = { lead: 'Lead', supporting: 'Supporting', featured: 'Featured', extra: 'Extra / background', crew: 'Crew', other: 'Other' };
const FORMATS = ['Short', 'Feature', 'Series', 'Documentary', 'Music video', 'Commercial', 'Stage', 'Other'];
const DISCIPLINES = ['Actor', 'Director', 'Writer', 'Producer', 'Camera / DOP', 'Editor', 'Sound', 'Production design', 'Wardrobe', 'Make-up', 'Music', 'Other crew'];
const COUNTRIES = ['South Africa', 'Nigeria', 'Kenya', 'Ghana', 'Zimbabwe', 'Botswana', 'Namibia', 'Lesotho', 'Eswatini', 'Mozambique', 'Zambia', 'Malawi', 'Tanzania', 'Uganda', 'Rwanda', 'Ethiopia', 'Egypt', 'Morocco', 'Senegal', "Côte d'Ivoire", 'Cameroon', 'Democratic Republic of the Congo', 'Angola', 'Other'];

let auth = null, USER = null, MINE = null;
async function call(action, extra, withToken = true) {
  const body = Object.assign({ action }, extra || {});
  if (withToken && USER) body.token = await USER.getIdToken();
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return { ok: r.ok, status: r.status, d: await r.json().catch(() => ({})) };
  } catch (e) { return { ok: false, status: 0, d: { message: 'No connection. Check your internet and try again.' } }; }
}
const app = () => $('#app');
function go(path) { history.pushState(null, '', path); route(); window.scrollTo(0, 0); }
window.addEventListener('popstate', route);
function modal(html) { $('#modalRoot').innerHTML = `<div class="modal-bg" data-act="bgClose"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal() { $('#modalRoot').innerHTML = ''; }
function needSignIn(what) { return `<div class="center"><h1>${esc(what)}</h1><p class="muted" style="margin:8px 0 18px">Free in 4flieks Lab.</p><a class="btn" href="/lab#join">Join or sign in</a></div>`; }
function verifyBanner() {
  if (!USER || !MINE || MINE.verified || MINE.role === 'filmmaker' || MINE.role === 'admin') return '';
  return `<div class="banner"><b>One step left: confirm your email.</b> We sent a link to ${esc(USER.email)}. Open it, then come back to post and apply.
    <div class="actions" style="margin-top:8px"><button class="sm ghost" data-act="resendVerify">Send the link again</button><button class="sm ghost" data-act="reload">I've confirmed it</button></div></div>`;
}
const payLine = p => `${PAY[p.pay_type] || ''}${p.pay_note ? ': ' + p.pay_note : ''}`;
const whereLine = p => [[p.city, p.country].filter(Boolean).join(', '), p.remote ? 'Remote OK' : ''].filter(Boolean).join(' · ');
const rateLine = r => r.rate ? `${R(r.rate)} ${r.rate_unit === 'flat' ? 'flat' : 'per ' + r.rate_unit}` : '';
const ageLine = r => r.age_min && r.age_max ? `Playing age ${r.age_min}–${r.age_max}` : r.age_min ? `Playing age ${r.age_min}+` : '';

/* ═════════ the board ═════════ */
let FILTER = { kind: '', q: '', country: '', pay: '' };
async function showBoard() {
  document.title = 'Opportunities board — 4flieks Lab';
  const sp = new URLSearchParams(location.search);
  FILTER = { kind: sp.get('kind') || '', q: sp.get('q') || '', country: sp.get('country') || '', pay: sp.get('pay') || '' };
  app().innerHTML = `${verifyBanner()}
    <h1>Opportunities</h1>
    <p class="lead">Casting calls, crew calls and collaborators for African film. Free to apply, and nobody on this board may ask you to pay to apply, audition or be cast.</p>
    <div class="actions">${USER ? `<button class="go" data-act="newPost">Post an opportunity</button><button class="ghost" data-act="nav" data-to="/lab/board/mine">My posts &amp; applications</button>` : `<a class="btn go" href="/lab#join">Join free to post or apply</a>`}</div>
    <div class="segs">${[['', 'All'], ['casting', 'Casting calls'], ['crew', 'Crew calls'], ['collab', 'Collaborators']].map(([k, n]) => `<button class="${FILTER.kind === k ? 'on' : ''}" data-act="kind" data-k="${k}">${n}</button>`).join('')}</div>
    <div class="filters">
      <label class="f q">Search<input id="fq" value="${esc(FILTER.q)}" placeholder="Role, language, town…"></label>
      <label class="f">Country<select id="fc"><option value="">Anywhere</option>${COUNTRIES.map(c => `<option ${FILTER.country === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="f">Pay<select id="fp"><option value="">Any</option>${Object.entries(PAY).map(([k, n]) => `<option value="${k}" ${FILTER.pay === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <button data-act="search">Search</button>
    </div>
    <div id="posts"><div class="center"><div class="spin"></div></div></div>
    <div id="industry"></div>`;
  loadIndustry();
  $('#fq').addEventListener('keydown', e => { if (e.key === 'Enter') ACT.search(); });
  const { ok, d } = await call('list', FILTER, false);
  const box = $('#posts'); if (!box) return;
  if (!ok) { box.innerHTML = `<div class="banner">${esc(d.message || 'Could not load the board.')}</div>`; return; }
  box.innerHTML = d.items.length ? `<div class="posts">${d.items.map(postCard).join('')}</div>`
    : `<div class="empty"><p><b>Nothing here yet${FILTER.kind || FILTER.q || FILTER.country || FILTER.pay ? ' for that search' : ''}.</b></p><p class="small" style="margin-top:6px">Making something? Post the first one.</p></div>`;
}
/* Funding and open calls from the wider industry (flieks-news): links out to the original. */
async function loadIndustry() {
  try {
    const r = await fetch('/.netlify/functions/flieks-news', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'list', tag: 'opps', limit: 6 }) });
    const d = await r.json().catch(() => ({}));
    const items = (Array.isArray(d.items) ? d.items : []).filter(it => it && /^https:\/\//.test(it.link));
    const box = $('#industry'); if (!r.ok || !items.length || !box) return;
    box.innerHTML = `<div class="industry"><h2>Funding and open calls from the industry</h2>
      <p class="small muted">Not posted on 4flieks. Each link opens the original on the organiser's site.</p>
      <ul>${items.map(it => `<li><span class="chips"><span class="chip ${it.tag === 'funding' ? 'green' : 'sun'}">${it.tag === 'funding' ? 'Funding' : 'Open call'}</span></span>
        <a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer nofollow">${esc(it.title)}</a>
        <span class="src">${esc(it.source)} · ${esc(new Date(it.at).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' }))}</span></li>`).join('')}</ul>
      <p class="small" style="margin-top:10px"><a href="/lab#news" style="color:var(--ink-2)">More SA film and TV news</a></p></div>`;
  } catch (e) { }
}
function postCard(p) {
  const left = daysLeft(p.closes);
  return `<a class="post ${esc(p.kind)}" href="/lab/board/p/${encodeURIComponent(p.id)}" data-nav>
    <div class="chips"><span class="chip ${p.kind === 'casting' ? 'sun' : 'dark'}">${esc(KIND[p.kind])}</span><span class="chip soft">${esc(p.format)}</span><span class="chip ${p.pay_type === 'paid' ? 'green' : 'soft'}">${esc(PAY[p.pay_type])}</span>${p.releases_on_4flieks ? '<span class="chip soft">On 4flieks</span>' : ''}</div>
    <h3>${esc(p.title)}</h3>
    <div class="meta">${esc(p.poster)}${whereLine(p) ? ' · ' + esc(whereLine(p)) : ''}</div>
    <div class="roles">${p.roles.slice(0, 5).map(r => esc(r.name)).join(' · ')}${p.roles.length > 5 ? ` · +${p.roles.length - 5} more` : ''}</div>
    <div class="foot"><span>${p.shoot_start ? 'Shoots ' + esc(dstr(p.shoot_start)) : ''}</span><span>${left <= 0 ? 'Closes today' : `Closes in ${left} day${left === 1 ? '' : 's'}`}</span></div></a>`;

/* ═════════ apply ═════════ */
async function applyModal(roleId) {
  if (!USER) { location.href = '/lab#join'; return; }
  const p = POST; const r = p.roles.find(x => x.id === roleId); if (!r) return;
  let hasProfile = false;
  try { const t = await fetch('/.netlify/functions/flieks-talent', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'me', token: await USER.getIdToken() }) }); const td = await t.json(); hasProfile = !!td.profile; } catch (e) { }
  modal(`<h3>Apply: ${esc(r.name)}</h3><p class="small muted" style="margin:4px 0 14px">${esc(p.title)} · ${esc(p.poster)}</p>
    ${hasProfile ? `<div class="banner ok small">Your <b>4flieks talent profile</b> will be shared with ${esc(p.poster)} for this application, even if you're not in the talent search.</div>`
      : `<div class="banner small">You have no talent profile yet. <a href="/talent" target="_blank" rel="noopener">Make one</a> (photo, credits, showreel) and you'll stand out. Or just tell them about yourself below.</div>`}
    ${r.minors ? `<div class="banner small"><b>This role is for under-18s.</b> A parent or guardian must apply on the young person's behalf.</div>
      <label class="f">Parent / guardian name<input id="apG" maxlength="80"></label>
      <label class="chk" style="margin:10px 0"><input type="checkbox" id="apGc"> I am the parent or legal guardian and I agree to this application.</label>` : ''}
    <label class="f" style="margin-top:10px">About you, for this role<textarea id="apNote" maxlength="1000" placeholder="Why you, what you've done, when you're free"></textarea></label>
    ${p.questions.map((q, i) => `<label class="f" style="margin-top:10px">${esc(q)}<textarea class="apA" data-i="${i}" maxlength="400" style="min-height:60px"></textarea></label>`).join('')}
    <label class="f" style="margin-top:10px">Showreel or self-tape link (optional)<input id="apReel" type="url" maxlength="300" placeholder="https://…"></label>
    <p class="tiny" style="margin-top:10px">Your email is not shown to them. They can message you through 4flieks, and you'll see their email when you reply.</p>
    <div class="actions" style="justify-content:flex-end"><button class="ghost" data-act="closeModal">Cancel</button><button class="go" data-act="sendApply" data-role="${esc(r.id)}">Send application</button></div>`);
}

      <div class="ph" ${photo ? `style="background-image:url('${esc(photo)}')"` : ''}>${photo ? '' : esc((x.name || '?').slice(0, 1).toUpperCase())}</div>
      <div><h3>${esc(x.name)}</h3>
        <div class="small muted">${pr ? [pr.disciplines && pr.disciplines.join(', '), [pr.city, pr.country].filter(Boolean).join(', '), pr.playing_age ? 'Playing age ' + pr.playing_age : '', (pr.languages || []).join(', ')].filter(Boolean).map(esc).join(' · ') : 'No talent profile'} · applied ${esc(new Date(x.at).toLocaleDateString('en-ZA'))}</div>
        ${x.guardian ? `<div class="chips" style="margin-top:6px"><span class="chip warn">Guardian: ${esc(x.guardian.name)}</span></div>` : ''}
        ${pr && pr.bio ? `<div class="qa"><b>Profile</b><p>${esc(pr.bio)}</p></div>` : ''}
        ${x.note ? `<div class="qa"><b>For this role</b><p>${esc(x.note)}</p></div>` : ''}
        ${qs.map((q, i) => x.answers[i] ? `<div class="qa"><b>${esc(q)}</b><p>${esc(x.answers[i])}</p></div>` : '').join('')}
        <div class="actions" style="margin-top:8px">
          ${safeUrl(x.reel) ? `<a class="btn sm ghost" href="${esc(safeUrl(x.reel))}" target="_blank" rel="noopener noreferrer">Reel / self-tape</a>` : ''}
          ${pr && safeUrl(pr.showreel) ? `<a class="btn sm ghost" href="${esc(safeUrl(pr.showreel))}" target="_blank" rel="noopener noreferrer">Showreel</a>` : ''}
          ${pr && safeUrl(pr.imdb) ? `<a class="btn sm ghost" href="${esc(safeUrl(pr.imdb))}" target="_blank" rel="noopener noreferrer">IMDb</a>` : ''}
        </div>
        <div class="actions">
          ${Object.entries(FOLDER).filter(([k]) => k !== x.folder).map(([k, n]) => `<button class="sm ${k === 'hire' ? 'go' : k === 'no' ? 'ghost' : ''}" data-act="move" data-id="${esc(x.appId)}" data-k="${k}">${k === 'review' ? 'Back to review' : k === 'hire' ? 'Hire' : n}</button>`).join('')}
          <button class="sm ghost" data-act="msg" data-id="${esc(x.appId)}">Message${x.messaged_at ? ' again' : ''}</button>
        </div>
        <label class="f" style="margin-top:10px">Private note (only you)<textarea data-note="${esc(x.appId)}" maxlength="1000" style="min-height:50px">${esc(x.private_note)}</textarea></label>
      </div></div>`; }).join('') : `<p class="small muted">Nobody in ${esc(FOLDER[MG.folder])} for this role.</p>`}`;
}

/* ═════════ events ═════════ */
const ACT = {
  bgClose: (el, e) => { if (e.target === el) closeModal(); }, closeModal,
  reload: () => location.reload(),
  resendVerify: async el => { el.disabled = true; try { await USER.sendEmailVerification({ url: 'https://4flieks.com/lab/board' }); el.textContent = 'Sent. Check your inbox (and spam).'; } catch (e) { el.textContent = 'Could not send. Try again in a minute.'; } },
  nav: el => go(el.dataset.to),
  newPost: () => go('/lab/board/new'),
  kind: el => { FILTER.kind = el.dataset.k; pushFilters(); },
  search: () => { FILTER.q = $('#fq').value.trim(); FILTER.country = $('#fc').value; FILTER.pay = $('#fp').value; pushFilters(); },
  apply: el => applyModal(el.dataset.role),
  sendApply: async el => {
    const r = POST.roles.find(x => x.id === el.dataset.role);
    const body = { id: POST.id, roleId: r.id, note: $('#apNote').value, reel: $('#apReel').value.trim(), answers: $$('.apA').map(t => t.value) };
    if (body.reel && !safeUrl(body.reel)) return toast('The link must start with https://', true);
    if (r.minors) { if (!$('#apGc').checked) return toast('A parent or guardian must agree', true); body.guardian = { name: $('#apG').value.trim(), consent: true }; }
    el.disabled = true;
    const { ok, d } = await call('apply', body);
    if (!ok) { el.disabled = false; return toast(d.message || 'Could not apply', true); }
    closeModal(); toast('Application sent'); showPost(POST.id);
  },
  report: () => modal(`<h3>Report this post</h3><p class="small muted" style="margin:6px 0 12px">Tell the 4flieks team what's wrong: asking for money, fake, unsafe, offensive. We check every report.</p>
    <textarea id="repR" maxlength="300"></textarea><div class="actions" style="justify-content:flex-end"><button class="ghost" data-act="closeModal">Cancel</button><button class="danger" data-act="sendReport">Report</button></div>`),
  sendReport: async el => { el.disabled = true; const { ok, d } = await call('report', { id: POST.id, reason: $('#repR').value }, false); if (!ok) { el.disabled = false; return toast(d.message || 'Could not send', true); } closeModal(); toast('Thanks. The team will look at it.'); },
  edKind: el => { ED.post.kind = el.dataset.k; drawEditor(); },
  addRole: () => { ED.post.roles.push(newRole(ED.post.kind)); drawEditor(); },
  delRole: el => { ED.post.roles = ED.post.roles.filter(r => r.id !== el.dataset.id); drawEditor(); },
  fromBudget: async () => {
    const prodId = $('#edBudget').value; if (!prodId) return toast('Choose a budget', true);
    const { ok, d } = await call('from-budget', { prodId });
    if (!ok) return toast(d.message || 'Could not read that budget', true);
    const want = ED.post.kind === 'casting' ? r => r.type !== 'crew' : r => r.type === 'crew';
    const add = d.roles.filter(want).map(r => Object.assign(newRole(ED.post.kind), r, { discipline: r.type === 'crew' ? '' : 'Actor' }));
    if (!add.length) return toast(`That budget has no ${ED.post.kind === 'casting' ? 'cast' : 'crew'} roles marked`, true);
    ED.post.roles = ED.post.roles.filter(r => r.name.trim()).concat(add).slice(0, 30);
    ED.post.prod_id = prodId;
    if (!ED.post.title) ED.post.title = d.title + (ED.post.kind === 'casting' ? ': cast' : ': crew');
    if (d.format) ED.post.format = d.format;
    if (!ED.post.shoot_start && d.shoot_start) ED.post.shoot_start = d.shoot_start;
    drawEditor(); toast(add.length + ' roles added');
  },
  savePost: async el => {
    const m = $('#edMsg'); m.textContent = '';
    ED.post.roles.forEach(r => { if (r.filled !== undefined) r.open = !r.filled; });
    el.disabled = true;
    const { ok, d } = await call('save', { id: ED.id || undefined, post: editorPayload() });
    el.disabled = false;
    if (!ok) { m.textContent = d.message || 'Could not save.'; return; }
    toast(d.status === 'live' ? 'Posted' : 'Sent to the 4flieks team to check');
    go('/lab/board/p/' + d.id);
  },
  closePost: async el => { if (!confirm('Close this post? Nobody will be able to apply.')) return; const { ok, d } = await call('close', { id: el.dataset.id }); if (!ok) return toast(d.message, true); showMine(); },
  reopen: async el => { const { ok, d } = await call('reopen', { id: el.dataset.id }); if (!ok) return toast(d.message, true); toast('Reopened'); showMine(); },
  delPost: async el => { if (!confirm('Delete this post and all its applications? This can\'t be undone.')) return; const { ok, d } = await call('delete', { id: el.dataset.id }); if (!ok) return toast(d.message, true); showMine(); },
  withdraw: async el => { if (!confirm('Withdraw this application?')) return; const { ok, d } = await call('withdraw', { appId: el.dataset.id }); if (!ok) return toast(d.message, true); showMine(); },
  mgRole: el => { MG.role = el.dataset.id; drawManage(); },
  mgFolder: el => { MG.folder = el.dataset.k; drawManage(); },
  move: async el => {
    const k = el.dataset.k;
    if (k === 'hire' && !confirm('Hire them? We\'ll email them that they got the part, and they can reply to you directly.')) return;
    const { ok, d } = await call('move', { id: MG.post.id, appId: el.dataset.id, folder: k });
    if (!ok) return toast(d.message || 'Could not move', true);
    const x = MG.apps.find(a => a.appId === el.dataset.id); if (x) x.folder = k;
    toast(k === 'hire' ? (d.added_to_budget ? 'Hired, and added to your budget\'s cast & crew' : 'Hired. We\'ve emailed them') : 'Moved to ' + FOLDER[k]); drawManage();
  },
  msg: el => { const x = MG.apps.find(a => a.appId === el.dataset.id); modal(`<h3>Message ${esc(x.name)}</h3><p class="small muted" style="margin:6px 0 12px">We email it to them. Their reply comes straight to your email. Neither address is shown on the site.</p>
    <textarea id="msgT" maxlength="1200" placeholder="e.g. We'd like to see a self-tape of scene 3. Can you send it by Friday?"></textarea>
    <div class="actions" style="justify-content:flex-end"><button class="ghost" data-act="closeModal">Cancel</button><button class="go" data-act="sendMsg" data-id="${esc(x.appId)}">Send</button></div>`); },
  sendMsg: async el => { el.disabled = true; const { ok, d } = await call('message', { id: MG.post.id, appId: el.dataset.id, message: $('#msgT').value }); if (!ok) { el.disabled = false; return toast(d.message || 'Could not send', true); } const x = MG.apps.find(a => a.appId === el.dataset.id); if (x) x.messaged_at = Date.now(); closeModal(); toast('Sent'); drawManage(); }
};
function pushFilters() { const q = new URLSearchParams(Object.entries(FILTER).filter(([, v]) => v)); history.replaceState(null, '', '/lab/board' + (q.toString() ? '?' + q : '')); showBoard(); }
document.addEventListener('click', e => {
  const n = e.target.closest('a[data-nav]');
  if (n && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0) { e.preventDefault(); go(n.getAttribute('href')); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.dataset.act !== 'bgClose') e.preventDefault();
  fn(a, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
/* editor fields */
document.addEventListener('input', e => editField(e));
document.addEventListener('change', e => editField(e, true));
function editField(e, changed) {
  const el = e.target; if (!ED) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.p) { ED.post[el.dataset.p] = val; if (changed && el.dataset.redraw !== undefined) drawEditor(); }
  else if (el.dataset.q !== undefined) ED.post.questions[+el.dataset.q] = val;
  else if (el.dataset.r) { const r = ED.post.roles.find(x => x.id === el.dataset.r); if (r) r[el.dataset.k] = val; }
}
/* private notes save when you leave the box */
document.addEventListener('focusout', async e => {
  const el = e.target; if (!el.dataset || !el.dataset.note || !MG) return;
  const x = MG.apps.find(a => a.appId === el.dataset.note); if (!x || x.private_note === el.value) return;
  const { ok } = await call('note', { id: MG.post.id, appId: x.appId, note: el.value });
  if (ok) { x.private_note = el.value; toast('Note saved'); } else toast('Note not saved', true);
});

/* ═════════ routes ═════════ */
function route() {
  closeModal();
  const path = location.pathname.replace(/\/+$/, '');
  let m;
  if ((m = path.match(/^\/lab\/board\/p\/(b[a-f0-9]{14})$/))) return showPost(m[1]);
  if ((m = path.match(/^\/lab\/board\/edit\/(b[a-f0-9]{14})$/))) return showEditor(m[1]);
  if ((m = path.match(/^\/lab\/board\/manage\/(b[a-f0-9]{14})$/))) return showManage(m[1]);
  if (path === '/lab/board/new') return showEditor(null);
  if (path === '/lab/board/mine') return showMine();
  if (path !== '/lab/board') history.replaceState(null, '', '/lab/board');
  return showBoard();
}
function boot() {
  if (typeof firebase === 'undefined') { app().innerHTML = '<div class="center"><h1>Could not load</h1><p class="muted">Check your connection and refresh.</p></div>'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  auth.onAuthStateChanged(async u => {
    USER = u || null; MINE = null;
    const acct = $('#navAcct'); if (acct) { acct.textContent = u ? 'My work' : 'Join free'; acct.href = u ? '/lab#work' : '/lab#join'; }
    if (u) { const r = await call('mine'); if (r.ok) MINE = { verified: r.d.verified, role: r.d.role }; }
    route();
  });
}
boot();
</script>
</body>
</html>
