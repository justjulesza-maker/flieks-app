<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget &amp; call sheets — 4flieks Lab</title>
<meta name="description" content="Budget your film, plan your shoot days and share call sheets. Free in 4flieks Lab.">
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/svg/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E2D4;--panel:#FBF8F1;--panel2:#F4F0E6;--line:#D9D1C2;--line2:#C9BFAE;
  --text:#17110E;--dim:#5E564D;--mute:#8A8177;
  --acc:#C2501F;--acc-ink:#FFFFFF;--acc-soft:rgba(194,80,31,.09);
  --good:#2E7D32;--good-soft:rgba(46,125,50,.10);--bad:#B3261E;--bad-soft:rgba(179,38,30,.08);
  --shadow:0 1px 3px rgba(23,17,14,.08),0 12px 40px rgba(23,17,14,.09);
  --r:6px;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--fb:'Archivo Black',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:84px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.hidden{display:none!important}

/* header: the Lab masthead */
.top{position:sticky;top:0;z-index:50;background:rgba(244,240,230,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top::before{content:'';display:block;height:5px;background:repeating-linear-gradient(90deg,var(--acc) 0 15px,transparent 15px 24px)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--text);margin-right:auto}
.brand .logo{font-family:var(--fb);font-size:15px}
.brand .logo em{color:var(--acc);font-style:normal}
.brand .tool{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-family:var(--mono);font-size:10.5px;color:var(--mute);min-width:64px;text-align:right}
.sync.err{color:var(--bad)}
.labnav{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.labnav::-webkit-scrollbar{display:none}
.labnav a{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:5px 9px;border:1px solid transparent;border-radius:4px;white-space:nowrap}
.labnav a:hover{color:var(--text);border-color:var(--line)}
.labnav a.on{color:var(--text);border-color:var(--text)}
.tabs{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--dim);cursor:pointer;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--acc)}

main{max-width:1200px;margin:0 auto;padding:20px 16px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--text);background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--text);border-color:var(--text);color:var(--panel2);font-weight:700}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px;line-height:1}
.icon:hover{color:var(--text);background:var(--panel2)}
.icon.del:hover{color:var(--bad)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=password],input:not([type]),select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input:disabled{opacity:.7;background:transparent;border-style:dashed}
textarea{resize:vertical;min-height:70px}
select{cursor:pointer}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;cursor:pointer}
.n{text-align:right;font-family:var(--mono);font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim);font-weight:500}
label.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.wgrid{grid-template-columns:2fr repeat(5,minmax(0,1fr))}
@media (max-width:720px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.g6,.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:4px}
.card .hint,.hint{font-size:12.5px;color:var(--mute);margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.pill.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .grow{flex:1}
h1.page{font-family:var(--fb);font-size:26px;font-weight:400;letter-spacing:-.015em;line-height:1.15}
.sub{color:var(--dim);font-size:13px}

/* budget */
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grp h3{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--acc);font-weight:700}
.grp .amt{font-family:var(--mono);font-weight:500;color:var(--dim)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sec-head{display:flex;align-items:center;gap:8px;padding:8px 10px}
.sec-head .sec-name{flex:1;font-weight:600;background:transparent;border-color:transparent;font-size:14px}
.sec-head .sec-name:hover{border-color:var(--line)}
.sec-head select{width:auto;font-size:12px;padding:4px 6px}
.sec-total{font-family:var(--mono);font-weight:600;min-width:110px;text-align:right}
.sec-body{border-top:1px solid var(--line);padding:6px 10px 10px}
.line,.lh{display:grid;grid-template-columns:minmax(0,1fr) 64px 168px 104px 112px 28px;gap:6px;align-items:center;padding:3px 0}
.lh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600;padding:4px 0}
.lh span:nth-child(n+2){text-align:right}
.units{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px}
.units select{font-size:12px;padding:6px 4px}
.tot{font-family:var(--mono);text-align:right;font-size:13px}
.line .desc{font-size:13.5px}
.line.linked .units input{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
@media (max-width:720px){
  .lh{display:none}
  .line{grid-template-columns:52px minmax(0,1fr) 88px 28px;grid-template-areas:"desc desc desc x" "qty units rate rate" "tot tot tot tot";padding:8px 0;border-bottom:1px dashed var(--line)}
  .line .desc{grid-area:desc}.line .qty{grid-area:qty}.line .units{grid-area:units}.line .rate{grid-area:rate}.line .tot{grid-area:tot;color:var(--dim)}.line .x{grid-area:x}
  .sec-total{min-width:0}
  .sec-head{flex-wrap:wrap}
  .sec-head .sec-name{flex:1 1 calc(100% - 44px)}
  .sec-head .sec-total{margin-left:auto}
}
.sumbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.sumbar-in{max-width:1200px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sumbar .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.sumbar .v{font-family:var(--mono);font-weight:600;font-size:15px}
.sumbar .v.big{font-size:18px;color:var(--acc)}
.sumbar .cell{display:flex;flex-direction:column}
@media (max-width:720px){.sumbar .opt{display:none}}

/* top sheet */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .k{font-size:11.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-family:var(--fb);font-size:22px;font-weight:400;margin-top:4px}
.kpi .s{font-size:12px;color:var(--dim);margin-top:2px}
.kpi.hl{border-color:color-mix(in srgb,var(--acc) 50%,transparent);background:linear-gradient(180deg,var(--acc-soft),transparent)}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t .r{text-align:right;font-family:var(--mono)}
table.t tr.gh td{font-weight:700;background:var(--panel2);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
table.t tr.tt td{font-weight:700}
table.t tr.grand td{font-weight:800;font-size:15px;border-top:2px solid var(--acc)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--acc)}
.tscroll{overflow-x:auto}

/* people / scenes lists */
.lrow{display:grid;gap:6px;align-items:center;padding:4px 0}
.people-row{grid-template-columns:1.2fr 1.1fr 1fr 1fr 1.3fr 28px}
.loc-row{grid-template-columns:1fr 1.6fr 1fr 1fr 1fr 1.2fr 28px}
.scene-row{grid-template-columns:52px 92px 92px 1fr 1.6fr 64px 1fr 130px 28px}
.lrow.head{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
@media (max-width:860px){
  .lrow.head{display:none}
  .people-row,.loc-row,.scene-row{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel2)}
  .lrow>.icon{justify-self:end}
}
.empty{text-align:center;padding:36px 16px;color:var(--dim)}
.empty h2{color:var(--text);font-size:20px;margin-bottom:6px}

/* call sheets */
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.daychip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-align:left}
.daychip b{display:block;font-size:13px}
.daychip small{color:var(--mute);font-size:11.5px}
.daychip.on{border-color:var(--acc);background:var(--acc-soft)}
.cs-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.cs-layout{grid-template-columns:minmax(0,1fr)}}
.cs-preview{position:sticky;top:110px}
@media (max-width:1000px){.cs-preview{position:static}}
.mini-row{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) 28px;gap:6px;margin-bottom:6px;align-items:center}
.dept-row{display:grid;grid-template-columns:minmax(0,1fr) 132px 28px;gap:6px;margin-bottom:6px}
.cast-row{display:grid;grid-template-columns:24px minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;margin-bottom:6px}
.cast-row.head{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.crewpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.crewpick label{font-size:12.5px}

/* printed / shared call sheet ("paper") */
.cs{background:#fff;color:#111;border-radius:10px;padding:22px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow)}
.cs *{color:inherit}
.cs .cs-top{display:grid;grid-template-columns:1fr auto;gap:14px;border-bottom:3px solid #111;padding-bottom:12px;margin-bottom:12px}
.cs .cs-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.cs .cs-meta{color:#555;font-size:12px}
.cs .cs-day{text-align:right}
.cs .cs-day .d{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cs .cs-day .date{font-size:16px;font-weight:700}
.cs .calls{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1.5px solid #111;border-radius:6px;overflow:hidden;margin-bottom:12px}
.cs .calls>div{padding:8px;border-right:1px solid #ccc;text-align:center}
.cs .calls>div:last-child{border-right:0}
.cs .calls .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#666;font-weight:700}
.cs .calls .v{font-size:18px;font-weight:800}
.cs .calls .crew{background:#111;color:#fff}.cs .calls .crew .k{color:#bbb}
.cs .blocks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.cs .blk{border:1px solid #ccc;border-radius:6px;padding:10px}
.cs h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#666;margin-bottom:6px;font-weight:800}
.cs table{width:100%;border-collapse:collapse;margin-bottom:12px}
.cs th{background:#111;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:5px 6px}
.cs td{border-bottom:1px solid #ddd;padding:5px 6px;vertical-align:top;overflow-wrap:anywhere}
.cs .blk,.cs .cs-title,.cs .cs-meta{overflow-wrap:anywhere}
.cs .dept td{background:#f1f1f1;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.cs .emerg{border:2px solid #c62828;background:#fff5f5}
.cs .emerg h4{color:#c62828}
.cs .foot{font-size:11px;color:#777;border-top:1px solid #ddd;padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cs a{color:#0b57d0}
@media (max-width:640px){.cs{padding:14px}.cs .blocks{grid-template-columns:1fr}.cs .calls{grid-template-columns:repeat(2,1fr)}.cs .calls>div:nth-child(2){border-right:0}.cs .calls>div:nth-child(-n+2){border-bottom:1px solid #ccc}.cs .cs-top{grid-template-columns:1fr}.cs .cs-day{text-align:left}.cs table{font-size:11.5px}}

/* actuals */
.var-pos{color:var(--good)}.var-neg{color:var(--bad)}
.costs{margin:2px 0 6px 12px;font-size:12px;color:var(--dim)}
.costs div{display:flex;gap:8px;align-items:center}
.costs .amt{font-family:var(--mono);margin-left:auto}

/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:560px;padding:20px;box-shadow:var(--shadow)}
.modal.wide{max-width:900px}
.modal h2{font-size:18px;margin-bottom:4px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.tpl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
@media (max-width:560px){.tpl-grid{grid-template-columns:1fr}}
.tpl{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--panel2);text-align:left}
.tpl b{display:block;margin-bottom:2px}
.tpl small{color:var(--mute)}
.tpl.on{border-color:var(--acc);background:var(--acc-soft)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--panel2);padding:10px 16px;border-radius:9px;font-weight:600;font-size:13px;z-index:200;transition:.2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--bad);color:#fff}
.imp-row{display:grid;grid-template-columns:24px minmax(0,1fr) 60px 60px 100px;gap:6px;align-items:center;margin-bottom:4px}
.banner{display:block;line-height:1.6;padding:10px 14px;border-radius:10px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);margin-bottom:16px;font-size:13px}
.banner.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.signin{max-width:420px;margin:8vh auto}

/* shared view */
body.shared{padding-bottom:24px}
body.shared .top,body.shared .sumbar{display:none}
.shared-wrap{max-width:900px;margin:0 auto;padding:16px}
.ack{margin-top:14px}

/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#111!important;padding:0!important}
  body.printing > *:not(#print){display:none!important}
  body.printing #print{display:block!important}
  body.shared .no-print{display:none!important}
  .cs{box-shadow:none;padding:0;border-radius:0}
  .pb{page-break-before:always}
  .pr table{width:100%;border-collapse:collapse;font-size:10.5px}
  .pr th,.pr td{border-bottom:1px solid #ccc;padding:4px 5px;text-align:left}
  .pr .r{text-align:right}
  .pr h1{font-size:18px;margin-bottom:2px}
  .pr h3{font-size:12px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.08em}
  .pr .gh td{background:#eee;font-weight:700}
  .pr .tt td{font-weight:700}
  .pr .grand td{font-weight:800;border-top:2px solid #111;font-size:12px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/lab"><span class="logo">4<em>flieks</em> Lab</span><span class="tool">Budget &amp; call sheets</span></a>
    <div class="hdr">
      <select id="prodSel" aria-label="Production" style="width:auto;max-width:220px"></select>
      <button class="btn sm pri" id="newProdBtn">+ New</button>
      <span class="sync" id="sync"></span>
    </div>
  </div>
  <nav class="labnav" id="labnav">
    <a href="/lab">Lab</a>
    <a href="/lab/report">Script Report</a>
    <a href="/script-upload.html">Script Coach</a>
    <a href="/lab/talent">Talent</a>
    <a href="/lab/budget" class="on">Budget</a>
    <a href="/lab#work" id="navAcct">My work</a>
  </nav>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="view"></main>

<div class="sumbar hidden" id="sumbar"><div class="sumbar-in">
  <div class="cell"><span class="k">Total budget</span><span class="v big" data-calc="grand"></span></div>
  <div class="cell"><span class="k">Per finished minute</span><span class="v" data-calc="perMin"></span></div>
  <div class="cell opt"><span class="k">Per shoot day</span><span class="v" data-calc="perDay"></span></div>
  <div class="cell"><span class="k">Break-even</span><span class="v" data-calc="beOwn"></span></div>
</div></div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script>

function eighthsToPages(e) { if (!e) return '0'; const w = Math.floor(e / 8), r = e % 8; return (w ? w : '') + (w && r ? ' ' : '') + (r ? r + '/8' : '') || '0'; }

function buildSections(tpl, m) {
  m = m || 1;
  return tpl.map(([g, name, lines], i) => ({
    id: uid('s'), name, group: g, open: i < 3, onceOff: name === 'Series once-off costs',
    lines: lines.map(([desc, rate, u, qty = 1, units = 1, role]) => {
      const link = { S: 'shoot', P: 'prep', O: 'post' }[u] || null;
      return { id: uid('l'), desc, qty, units: link ? 0 : (u === 'Day' ? units * m : units), unit: link ? 'Day' : u, link, rate: u === 'Flat' ? Math.round(rate * m) : rate, role: role || null, notes: '' };
    })
  }));
}
function newProduction(title, type) {
  const p = { id: uid('p'), title: title || 'Untitled production', type, company: '', director: '', producer: '', runtime: 12, episodes: 1,
    days: { prep: 5, shoot: 3, post: 8 }, contPct: 10, feePct: 0, vatOn: false, vatRate: LAB.vatRate,
    sections: [], contacts: [], locations: [], scenes: [], shootDays: [], costs: [], locked: null, createdAt: Date.now(), updatedAt: Date.now() };
  if (type === 'short') p.sections = buildSections(FILM_TPL, 1);
  else if (type === 'feature') { p.runtime = 90; p.days = { prep: 20, shoot: 18, post: 40 }; p.sections = buildSections(FILM_TPL, 4); }
  else if (type === 'music') { p.runtime = 4; p.days = { prep: 3, shoot: 1, post: 4 }; p.sections = buildSections(MV_TPL, 1); }
  else if (type === 'series') { p.runtime = 24; p.episodes = 13; p.days = { prep: 2, shoot: 2, post: 4 }; p.sections = buildSections(FILM_TPL.concat([SERIES_ONCEOFF]), 1); }
  else { p.type = type || 'other'; p.sections = GROUPS.map(([g, n]) => ({ id: uid('s'), name: n, group: g, open: true, lines: [] })); }
  return p;
}
function normalize(p) {
  p.sections = arr(p.sections); p.sections.forEach(s => { s.lines = arr(s.lines); });
  ['contacts', 'locations', 'scenes', 'shootDays', 'costs'].forEach(k => p[k] = arr(p[k]));
  p.shootDays.forEach(d => { d.deptCalls = arr(d.deptCalls); d.running = arr(d.running); d.cast = d.cast || {}; d.crewOff = d.crewOff || {}; d.weather = d.weather || {}; });
  p.days = Object.assign({ prep: 0, shoot: 1, post: 0 }, p.days || {});
  if (p.locked) { p.locked.lines = p.locked.lines || {}; p.locked.secs = p.locked.secs || {}; }
  ['contPct', 'feePct', 'runtime', 'episodes'].forEach(k => p[k] = num(p[k]));
  if (!p.vatRate) p.vatRate = LAB.vatRate;
  return p;
}

/* ═════════════ maths ═════════════ */
const lineUnits = (l, p) => l.link ? num((p || P).days[l.link]) : num(l.units);
const lineTotal = (l, p) => num(l.qty) * lineUnits(l, p) * num(l.rate);
const secTotal = (s, p) => s.lines.reduce((a, l) => a + lineTotal(l, p), 0);
function totals(p) {
  p = p || P;
  const series = p.type === 'series';
  const grp = { atl: 0, btl: 0, post: 0, other: 0 }; const secs = {}; const lines = {};
  let direct = 0, onceOff = 0;
  p.sections.forEach(s => {
    let t = 0; s.lines.forEach(l => { const v = lineTotal(l, p); lines[l.id] = v; t += v; });
    secs[s.id] = t; grp[s.group] = (grp[s.group] || 0) + t;
    if (series && s.onceOff) onceOff += t; else direct += t;
  });
  const cF = num(p.contPct) / 100, fF = num(p.feePct) / 100;
  const cont = direct * cF, fee = (direct + cont) * fF;
  const perEp = direct + cont + fee;
  const eps = series ? Math.max(1, num(p.episodes)) : 1;
  const onceOffAll = onceOff * (1 + cF) * (1 + fF);
  const exVat = perEp * eps + onceOffAll;
  const vat = p.vatOn ? exVat * num(p.vatRate) / 100 : 0;
  const grand = exVat + vat;
  const mins = Math.max(0, num(p.runtime)) * eps;
  const shootDays = Math.max(0, num(p.days.shoot)) * eps;
  const share = LAB.filmmakerShare;
  const perOwn = LAB.priceOwn * share, perRent = LAB.priceRent * share;
  return { grp, secs, lines, direct, onceOff, cont, fee, perEp, eps, onceOffAll, exVat, vat, grand, mins,
    perMin: mins ? grand / mins : 0, perDay: shootDays ? grand / shootDays : 0,
    perOwn, perRent, beOwn: perOwn ? Math.ceil(grand / perOwn) : 0, beRent: perRent ? Math.ceil(grand / perRent) : 0,
    series };
}

/* ═════════════ state & API ═════════════ */
let auth = null, USER = null, ME = { verified: true, role: 'viewer', imports: {} };

function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function saveUI() { lsSet(LS_UI, { tab: TAB, prod: P && P.id }); }

async function call(action, extra, withToken = true) {
  const body = Object.assign({ action }, extra || {});
  if (withToken && USER) body.token = await USER.getIdToken();
  try {
    const r = await fetch(LAB.api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, d };
  } catch (e) { return { ok: false, status: 0, d: { message: 'No connection. Check your internet and try again.' } }; }
}
const canEdit = () => ME.verified || ME.role === 'filmmaker' || ME.role === 'admin';
function withoutId(p) { const c = Object.assign({}, p); delete c.id; return c; }
async function loadIndex() {
  const { ok, d } = await call('list');
  if (!ok) throw new Error(d.message || 'Could not load your productions.');
  INDEX = d.items || []; ME = { verified: !!d.verified, role: d.role || 'viewer', imports: d.imports || {} };
}
async function openProduction(id) {
  const { ok, d } = await call('get', { id });
  if (!ok) { toast(d.message || 'Could not open that production', true); return false; }
  P = normalize(Object.assign(d.production, { id: d.id })); CUR_DAY = null; saveUI(); return true;
}
function touchIndex() { if (!P) return; const it = INDEX.find(x => x.id === P.id); if (it) { it.title = P.title; it.type = P.type; it.updated_at = Date.now(); } }

/* One save at a time; changes made while a save is in flight go in the next one. */
let saveTimer = null, saving = false, again = false;
function setSync(s, msg) { const el = $('#sync'); if (!el) return; el.className = 'sync' + (s === 'error' ? ' err' : ''); el.textContent = s === 'saving' ? 'Saving…' : s === 'saved' ? '✓ Saved' : s === 'error' ? (msg || 'Not saved') : ''; }
function markDirty() { if (!P) return; if (!canEdit()) { setSync('error', 'Confirm your email to save'); return; } P.updatedAt = Date.now(); touchIndex(); setSync('saving'); clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; saveNow(); }, 800); }
async function saveNow() {
  if (!P) return;
  if (saving) { again = true; return; }
  saving = true;
  const { ok, d } = await call('save', { id: P.id, production: withoutId(P) });
  saving = false;
  if (ok) setSync('saved'); else { setSync('error', d.message || 'Not saved'); if (d.message) toast(d.message, true); }
  if (again) { again = false; saveNow(); }
}
async function flushSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; await saveNow(); } while (saving) await new Promise(r => setTimeout(r, 80)); }
window.addEventListener('pagehide', () => { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveNow(); } });

  <p style="max-width:520px;margin:0 auto 18px">Start from a template for a short, music video, feature or series episode, with starting rates in rands. Then build your cast &amp; crew list, schedule scenes into shoot days and share call sheets your crew can open on their phones.</p>

function refreshCalc() {
  if (!P) return;
  const T = totals();
  const map = {
    grand: R(T.grand), perMin: T.mins ? R(T.perMin) : '—', perDay: T.perDay ? R(T.perDay) : '—',
    beOwn: T.beOwn ? N(T.beOwn) + ' sales' : '—', exVat: R(T.exVat), vat: R(T.vat), cont: R(T.cont), fee: R(T.fee),
    direct: R(T.direct), perEp: R(T.perEp)

  $$('[data-calc]').forEach(el => {
    const k = el.dataset.calc;
    if (k in map) el.textContent = map[k];
    else if (k.startsWith('line:')) el.textContent = R(T.lines[k.slice(5)] || 0);
    else if (k.startsWith('sec:')) el.textContent = R(T.secs[k.slice(4)] || 0);
    else if (k.startsWith('grp:')) el.textContent = R(T.grp[k.slice(4)] || 0);

    <tr><td colspan="3">Contingency ${p.contPct}%</td><td class="r">${R(T.cont)}</td></tr>
    <tr><td colspan="3">Production fee ${p.feePct}%</td><td class="r">${R(T.fee)}</td></tr>`;
  return `
  <div class="toolbar"><div class="grow"><h1 class="page">Top sheet</h1><div class="sub">${esc(p.title)}${p.company ? ' · ' + esc(p.company) : ''}</div></div><button class="btn" data-act="printBudget">Print / PDF</button></div>

    <div class="kpi"><div class="k">${series ? 'Per episode' : 'Per shoot day'}</div><div class="v">${series ? R(T.perEp) : (T.perDay ? R(T.perDay) : '—')}</div><div class="s">${series ? 'before once-off & VAT' : p.days.shoot + ' shoot days'}</div></div>
    <div class="kpi"><div class="k">Break-even on 4flieks</div><div class="v">${N(T.beOwn)}</div><div class="s">sales at R${LAB.priceOwn} (you earn ${R2(T.perOwn)} each) · or ${N(T.beRent)} rentals</div></div>
  </div>
  <div class="card tscroll"><table class="t">

function deptMatch(s) {
  s = String(s || '').toLowerCase();
  if (/post|editor|colour|sound design/.test(s)) return 'Post-production';
  if (/make-up|makeup|hair/.test(s)) return 'Hair & Make-up';
  if (/camera|photograph|focus|\bdit\b|stills|bts/.test(s)) return 'Camera';
  if (/light|grip|gaffer|spark/.test(s)) return 'Lighting & Grip';
  if (/sound|boom/.test(s)) return 'Sound';
  if (/\bart\b|prop|design/.test(s)) return 'Art Department';
  if (/wardrobe|stylist/.test(s)) return 'Wardrobe';
  if (/unit|security|location|medic/.test(s)) return 'Unit & Locations';
  if (/cater/.test(s)) return 'Catering';
  return '';
}
function deptFor(secName, desc) { return deptMatch(desc) || deptMatch(secName) || 'Production'; }

  </div>
  <div class="cs-preview"><div class="sub" style="margin-bottom:8px">Preview</div>${sheetHTML(sheetData(P, d))}</div></div>`;

function waText(d, url) { const i = P.shootDays.indexOf(d); return `🎬 ${P.title}: call sheet, Day ${i + 1}${d.date ? ' (' + fmtDate(d.date) + ')' : ''}. Crew call ${d.crewCall || 'TBC'}. ${url}`; }

function sheetData(p, d) {
  const i = p.shootDays.indexOf(d); const loc = p.locations.find(l => l.id === d.locationId) || {};
  const crew = p.contacts.filter(c => c.kind !== 'cast' && !d.crewOff[c.id]);
  const byDept = {}; crew.forEach(c => { const k = c.dept || 'Production'; (byDept[k] = byDept[k] || []).push({ name: c.name || '', role: c.role || '', phone: d.hidePhones ? '' : (c.phone || '') }); });
  const depts = STD_DEPTS.filter(k => byDept[k]).concat(Object.keys(byDept).filter(k => !STD_DEPTS.includes(k)));
  const cast = p.contacts.filter(c => c.kind === 'cast' && d.cast[c.id] && d.cast[c.id].on).map(c => ({ name: c.name || '', character: c.character || '', pickup: d.cast[c.id].pickup || '', hmu: d.cast[c.id].hmu || '', set: d.cast[c.id].set || '', phone: d.hidePhones ? '' : (c.phone || '') }));
  const scenes = p.scenes.filter(s => s.dayId === d.id).map(s => ({ no: s.no || '', ie: s.ie || '', dn: s.dn || '', set: s.set || '', desc: s.desc || '', pages: s.pages || '', cast: s.cast || '' }));
  const next = p.shootDays[i + 1];
  const nextLoc = next ? (p.locations.find(l => l.id === next.locationId) || {}) : {};
  return {
    title: p.title, company: p.company || '', director: p.director || '', producer: p.producer || '',
    dayNo: i + 1, dayCount: p.shootDays.length, date: d.date || '',
    calls: { crew: d.crewCall || '', shoot: d.shootCall || '', lunch: d.lunch || '', wrap: d.wrap || '' },
    loc: { name: loc.name || '', address: loc.address || '', town: loc.town || '', parking: loc.parking || '', contact: loc.contact || '', hospital: loc.hospital || '' },
    weather: d.weather || {}, deptCalls: d.deptCalls.map(x => ({ dept: x.dept || '', time: x.time || '' })),
    crew: depts.map(k => ({ dept: k, people: byDept[k] })), cast, scenes,
    pages: eighthsToPages(p.scenes.filter(s => s.dayId === d.id).reduce((a, s) => a + pagesToEighths(s.pages), 0)),
    running: d.running.map(x => ({ time: x.time || '', item: x.item || '', who: x.who || '' })),
    notes: d.notes || '', emergency: d.emergency || '',
    next: next ? { date: next.date || '', location: nextLoc.name || '', scenes: p.scenes.filter(s => s.dayId === next.id).map(s => s.no).join(', ') } : null,
    updatedAt: Date.now()
  };
}

function telLink(p) { p = String(p || ''); return /^\+?[0-9 ()-]{3,24}$/.test(p) ? `<a href="tel:${esc(p.replace(/[^0-9+]/g, ''))}">${esc(p)}</a>` : esc(p); }

  <div class="foot"><span>Made with the 4flieks Lab</span><span>Updated ${new Date(s.updatedAt || Date.now()).toLocaleString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span></div>

async function loadAcks() {
  const el = $('#acks'); const d = curDay(); if (!el || !d || !d.token) return;
  const { ok, d: r } = await call('acks', { id: P.id, dayId: d.id });

async function fetchWeather() {
  const d = curDay(); const loc = P.locations.find(l => l.id === d.locationId);
  const place = loc && (loc.town || loc.address);
  if (!place) return toast('Add a town / suburb to this day\'s location first', true);
  if (!d.date) return toast('Set the shoot date first', true);
  toast('Fetching forecast…');
  const { ok, d: r } = await call('weather', { place, date: d.date });
  if (!ok || !r.ok) return toast(r.message || 'Weather lookup failed', true);
  d.weather = r.weather; markDirty(); render(); toast('Forecast added');
}
async function publish() {

/* ═════════════ ACTUALS ═════════════ */
function vActuals() {
  const p = P;
  if (!p.locked) return `<div class="card empty"><h2>Track what you spend</h2><p style="max-width:520px;margin:0 auto 16px">Lock your budget before the shoot. Then log every invoice and payment against a line and see where you're over or under.</p><button class="btn pri" data-act="lock">🔒 Lock budget at ${R(totals().grand)}</button></div>`;
  const L = p.locked; const costs = p.costs;
  const actualBy = {}, secOther = {};
  costs.forEach(c => { if (c.lineId) actualBy[c.lineId] = (actualBy[c.lineId] || 0) + num(c.amount); else secOther[c.secId] = (secOther[c.secId] || 0) + num(c.amount); });
  const spent = costs.reduce((a, c) => a + num(c.amount), 0);
  const lockedDirect = Object.values(L.lines).reduce((a, v) => a + num(v), 0);
  const remaining = L.grand - spent;
  let rows = '';
  GROUPS.forEach(([g, gname]) => {
    const secs = p.sections.filter(s => s.group === g); if (!secs.length) return;
    rows += `<tr class="gh"><td colspan="5">${gname}</td></tr>`;
    secs.forEach(s => {
      const sb = s.lines.reduce((a, l) => a + num(L.lines[l.id]), 0);
      const sa = s.lines.reduce((a, l) => a + (actualBy[l.id] || 0), 0) + (secOther[s.id] || 0);
      rows += `<tr class="tt"><td>${esc(s.name)}</td><td class="r">${R(sb)}</td><td class="r">${R(sa)}</td><td class="r ${sb - sa >= 0 ? 'var-pos' : 'var-neg'}">${sa ? R(sb - sa) : '—'}</td><td><button class="btn sm ghost" data-act="addCost" data-s="${s.id}" title="Cost for this section, not a specific line">+ Other</button></td></tr>`;
      s.lines.forEach(l => {
        const b = num(L.lines[l.id]), a = actualBy[l.id] || 0; const lc = costs.filter(c => c.lineId === l.id);
        rows += `<tr><td style="padding-left:18px">${esc(l.desc)}${L.lines[l.id] === undefined ? ' <span class="pill acc">added after lock</span>' : ''}${lc.length ? `<div class="costs">${lc.map(c => `<div>· ${esc(c.supplier)} ${c.ref ? '(' + esc(c.ref) + ')' : ''} <span class="sub">${esc(c.date)}</span><span class="amt">${R(c.amount)}</span><button class="icon" data-act="editCost" data-id="${c.id}">✎</button></div>`).join('')}</div>` : ''}</td>
          <td class="r">${R(b)}</td><td class="r">${a ? R(a) : '—'}</td><td class="r ${b - a >= 0 ? 'var-pos' : 'var-neg'}">${a ? R(b - a) : '—'}</td>
          <td><button class="btn sm" data-act="addCost" data-s="${s.id}" data-l="${l.id}">+ Cost</button></td></tr>`;
      });
      costs.filter(c => !c.lineId && c.secId === s.id).forEach(c => rows += `<tr><td style="padding-left:18px"><div class="costs" style="margin:0"><div>· Other: ${esc(c.supplier)} ${c.ref ? '(' + esc(c.ref) + ')' : ''} <span class="sub">${esc(c.date)}</span><button class="icon" data-act="editCost" data-id="${c.id}">✎</button></div></div></td><td></td><td class="r">${R(c.amount)}</td><td></td><td></td></tr>`);
    });
  });
  return `
  <div class="toolbar"><div class="grow"><h1 class="page">Actuals</h1><div class="sub">Against the budget locked on ${new Date(L.at).toLocaleDateString('en-ZA')}</div></div><button class="btn" data-act="costCsv">Export costs CSV</button></div>
  <div class="kpis">
    <div class="kpi"><div class="k">Locked budget</div><div class="v">${R(L.grand)}</div><div class="s">${R(lockedDirect)} direct + contingency, fees${p.vatOn ? ', VAT' : ''}</div></div>
    <div class="kpi"><div class="k">Spent</div><div class="v">${R(spent)}</div><div class="s">${costs.length} cost${costs.length === 1 ? '' : 's'} logged</div></div>
    <div class="kpi ${remaining < 0 ? '' : 'hl'}"><div class="k">Remaining</div><div class="v ${remaining < 0 ? 'var-neg' : ''}">${R(remaining)}</div><div class="s">${pct(L.grand ? spent / L.grand * 100 : 0)} used</div></div>
    <div class="kpi"><div class="k">Direct lines</div><div class="v ${lockedDirect - spent < 0 ? 'var-neg' : ''}">${R(lockedDirect - spent)}</div><div class="s">left before touching contingency</div></div>
  </div>
  <div class="card tscroll"><table class="t"><thead><tr><th>Line</th><th class="r">Budget</th><th class="r">Actual</th><th class="r">Variance</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

  const c = ctx.id ? P.costs.find(x => x.id === ctx.id) : { supplier: '', amount: '', date: today(), ref: '', notes: '', secId: ctx.s, lineId: ctx.l || null };

async function runImport() {
  if (!canEdit()) return toast('Confirm your email first', true);
  const f = $('#impFile').files[0]; if (!f) return toast('Choose a PDF first', true);
  if (!/\.pdf$/i.test(f.name)) return toast('Choose a PDF file', true);
  if (f.size > 4 * 1024 * 1024) return toast('PDF too large. Keep it under 4 MB or split it', true);
  const st = $('#impStatus'); const go = $('#impGo'); go.disabled = true; st.textContent = 'Uploading…';
  const secId = $('#impSec').value, newName = $('#impNew').value.trim() || f.name.replace(/\.pdf$/i, '');
  try {
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
    const { ok, d } = await call('import-start', { fileBase64: b64, fileName: f.name });
    if (!ok) throw new Error(d.message || 'Could not start');
    st.textContent = 'Reading your quote… this can take a minute.';
    const until = Date.now() + 5 * 60e3;
    for (;;) {
      await new Promise(r => setTimeout(r, 3000));
      const { ok: ok2, d: s2 } = await call('import-status', { jobId: d.jobId });
      if (!ok2) throw new Error(s2.message || 'Lost track of the import');
      if (s2.status === 'error') throw new Error(s2.error);
      if (s2.status === 'done') { IMPORT = { items: s2.items.map(it => ({ ...it, on: true })), secId, newName, remaining: null }; break; }
      if (Date.now() > until) throw new Error('This is taking too long. Try a smaller PDF.');
    }
    const { d: L } = await call('list'); ME.imports = L.imports || ME.imports;
    if (ME.imports && ME.imports.limit != null) IMPORT.remaining = Math.max(0, ME.imports.limit - ME.imports.used);
    importPreview();
  } catch (e) { if ($('#impGo')) { go.disabled = false; st.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; } }
}

    const sup = $('#cSup').value.trim(), amt = num($('#cAmt').value);
    if (!sup) return toast('Who was it paid to?', true); if (!amt) return toast('Enter an amount', true);
    const id = el.dataset.id; const c = id ? P.costs.find(x => x.id === id) : { id: uid('k'), secId: el.dataset.s, lineId: el.dataset.l || null, loggedAt: Date.now() };
    Object.assign(c, { supplier: sup, amount: amt, date: $('#cDate').value || today(), ref: $('#cRef').value.trim(), notes: $('#cNotes').value.trim() });
    if (!id) P.costs.push(c); closeModal(); markDirty(); render(); toast('Cost saved');
  },
  delCost: el => { if (!confirm('Delete this cost?')) return; P.costs = P.costs.filter(c => c.id !== el.dataset.id); closeModal(); markDirty(); render(); }
};
function moveSec(id, dir) {
  const s = P.sections.find(x => x.id === id); const same = P.sections.filter(x => x.group === s.group); const i = same.indexOf(s); const j = i + dir;
  if (j < 0 || j >= same.length) return; const a = P.sections.indexOf(s), b = P.sections.indexOf(same[j]); [P.sections[a], P.sections[b]] = [P.sections[b], P.sections[a]]; markDirty(); render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { TAB = t.dataset.tab; saveUI(); render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.tagName === 'A' && a.getAttribute('href') === '#') e.preventDefault();
  const fn = ACT[a.dataset.act]; if (fn) { if (a.dataset.act !== 'bgClose') e.preventDefault(); fn(a, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#prodSel').addEventListener('change', async e => { await flushSave(); if (await openProduction(e.target.value)) render(); });
$('#newProdBtn').addEventListener('click', newProdModal);

/* ═════════════ auth & boot ═════════════ */
function gate(html) { $('#tabs').innerHTML = ''; $('#sumbar').classList.add('hidden'); $('#view').innerHTML = `<div class="card empty">${html}</div>`; }
async function start() {
  try { await loadIndex(); } catch (e) { gate(`<h2>Couldn't load your productions</h2><p>${esc(e.message)}</p>`); return; }
  const ui = lsGet(LS_UI, {});
  TAB = ui.tab && TABS.some(t => t[0] === ui.tab) ? ui.tab : 'budget';
  const want = new URLSearchParams(location.search).get('p');
  const pick = INDEX.find(x => x.id === want) || INDEX.find(x => x.id === ui.prod) || INDEX.slice().sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0))[0];
  P = null; if (pick) await openProduction(pick.id);
  render();
}
function boot() {
  const m = location.pathname.match(/^\/call\/([a-z0-9]{20,40})\/?$/);
  if (m) return sharedView(m[1]);
  if (/^\/call\//.test(location.pathname)) return sharedView('');
  if (typeof firebase === 'undefined') { gate('<h2>Could not load sign-in</h2><p>Check your connection and refresh.</p>'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  $('#view').innerHTML = '<div class="empty">Loading…</div>';
  auth.onAuthStateChanged(async u => {
    USER = u || null;
    if (!u) { P = null; INDEX = []; $('#prodSel').innerHTML = ''; gate(`<h2>Budget &amp; call sheets</h2><p style="max-width:520px;margin:0 auto 16px">Budget your film in rands, plan your shoot days and share call sheets your crew can open on their phones. Free in 4flieks Lab.</p><a class="btn pri" href="/lab#join">Join or sign in</a>`); return; }
    await start();
  });
}

/* ═════════════ shared call sheet (/call/<token>) ═════════════ */
async function sharedView(token) {
  document.body.classList.add('shared');
  const root = $('#view'); root.className = 'shared-wrap';
  if (!/^[a-z0-9]{20,40}$/.test(token)) { root.innerHTML = '<div class="card empty"><h2>Call sheet not found</h2></div>'; return; }
  root.innerHTML = '<div class="empty">Loading call sheet…</div>';
  const { ok, status, d } = await call('sheet', { t: token }, false);
  if (!ok || !d.sheet) { root.innerHTML = status === 404 ? '<div class="card empty"><h2>Call sheet not found</h2><p>The link may be wrong, or production took it down.</p></div>' : '<div class="card empty"><h2>Couldn\'t load the call sheet</h2><p>Check your connection and refresh.</p></div>'; return; }
  const s = d.sheet; s.scenes = arr(s.scenes); s.cast = arr(s.cast); s.running = arr(s.running); s.deptCalls = arr(s.deptCalls); s.crew = arr(s.crew).map(g => ({ ...g, people: arr(g.people) }));
  s.loc = s.loc || {}; s.calls = s.calls || {};
  document.title = `${s.title}: call sheet, day ${s.dayNo}`;
  let acked = false; try { acked = !!localStorage.getItem('ack_' + token); } catch (e) { }
  root.innerHTML = `${sheetHTML(s)}
    <div class="card ack no-print" id="ackBox">${acked ? '<b>✓ Thanks. You confirmed you\'ve received this call sheet.</b>' : `<h2>Got it?</h2><p class="hint">Let production know you've received this call sheet.</p><div class="row"><input id="ackName" maxlength="80" placeholder="Your name &amp; role" style="flex:1;min-width:180px"><button class="btn pri" id="ackGo">Got it ✓</button></div>`}</div>
    <div class="row no-print" style="justify-content:center"><button class="btn" data-act="printPage">Print / save PDF</button><a class="btn ghost" href="/lab">Made with 4flieks Lab</a></div>`;
  const go = $('#ackGo');
  if (go) go.addEventListener('click', async () => {
    const name = $('#ackName').value.trim().slice(0, 80); if (name.length < 2) return toast('Add your name', true);
    go.disabled = true;
    const { ok: ok2, d: r } = await call('ack', { t: token, name }, false);
    if (!ok2) { go.disabled = false; return toast(r.message || 'Could not send. Check your connection', true); }
    try { localStorage.setItem('ack_' + token, '1'); } catch (e) { }
    $('#ackBox').innerHTML = '<b>✓ Thanks, ' + esc(name) + '. Production can see you\'ve got it.</b>';
  });
}
ACT.printPage = () => window.print();

boot();
</script>
